<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A18">
<meta name="robots" content="noindex">
<title>Taskana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 240'%3E%3Cpath d='M78 34H42a10 10 0 00-10 10v152a10 10 0 0010 10h36M162 34h36a10 10 0 0110 10v152a10 10 0 01-10 10h-36' fill='none' stroke='%231F3D24' stroke-width='18' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M148 92A44 44 0 10152 148V122H122' fill='none' stroke='%238CC63E' stroke-width='20' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — light rail navigation, header bar, scrolling work area.
   Palette and type follow the GALIL brand (forest + leaf green, Noto Sans). */
:root{
  --font:"Noto Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:"Noto Sans Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#FBFCF9; --panel:#FFFFFF; --panel2:#F4F7F0; --ink:#1F3D24; --muted:#5F6E62; --line:#DDE6D5;
  --brand:#1F3D24; --leaf:#8CC63E; --annot:#17A3B8;
  --side-bg:#F1F5EC; --side-tx:#1F3D24; --side-dim:#55665A; --side-hover:#E3ECDA; --side-on:#FFFFFF; --side-line:#D9E4D0;
  --green:#8CC63E; --deep:#4E7A1C; --deepfg:#FFFFFF; --hover:#EDF4E3;
  --blue:#2A78D6; --bluebg:#E8F1FC; --bluetx:#1E548F;
  --amber:#EDA100; --amberbg:#FEF6E7; --ambertx:#7A5407;
  --err:#C0392B; --errbg:#FBEBE9;
  --violet:#6250D6; --violetbg:#EFECFB; --violettx:#45379A;
  --pink:#E87BA4; --pinkbg:#FCEDF3; --pinktx:#9C2F5A;
  --teal:#1F9A8A; --tealbg:#E4F5F2; --tealtx:#12665B;
  --grey:#8A9585; --greybg:#EEF1EB;
  /* workflow colors (validated as an adjacent categorical set) */
  --st-backlog:#A3ADA0; --st-todo:#2A78D6; --st-writing:#EDA100; --st-peer:#E87BA4; --st-sme:#6250D6; --st-done:#008300;
  --s-created:#2A78D6; --s-closed:#008300;
  --grid:#E6ECE0;
  --shadow:0 1px 2px rgba(31,61,36,.05),0 6px 18px rgba(31,61,36,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1710; --panel:#16211A; --panel2:#1B281E; --ink:#E4EFE0; --muted:#9AAD96; --line:#2A3A2C;
  --brand:#E4EFE0; --leaf:#9FD154; --annot:#49C2D4;
  --side-bg:#121C14; --side-tx:#E4EFE0; --side-dim:#9AAD96; --side-hover:#1C2A1F; --side-on:#22322A; --side-line:#26352A;
  --green:#9FD154; --deep:#B6E072; --deepfg:#14260A; --hover:#1F2D22;
  --blue:#7FB2F0; --bluebg:#14263D; --bluetx:#9CC5F5;
  --amber:#F5B84F; --amberbg:#2E2412; --ambertx:#F0C270;
  --err:#F0796B; --errbg:#2E1815;
  --violet:#9085E9; --violetbg:#231E3B; --violettx:#C2B9F5;
  --pink:#D55181; --pinkbg:#35192A; --pinktx:#F0A3C0;
  --teal:#5FD0BF; --tealbg:#12302B; --tealtx:#8FE3D6;
  --grey:#8C9884; --greybg:#243026;
  --st-backlog:#6F7C6B; --st-todo:#3987E5; --st-writing:#C98500; --st-peer:#D55181; --st-sme:#9085E9; --st-done:#008300;
  --s-created:#3987E5; --s-closed:#2E9E2E;
  --grid:#24322A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1710; --panel:#16211A; --panel2:#1B281E; --ink:#E4EFE0; --muted:#9AAD96; --line:#2A3A2C;
  --brand:#E4EFE0; --leaf:#9FD154; --annot:#49C2D4;
  --side-bg:#121C14; --side-tx:#E4EFE0; --side-dim:#9AAD96; --side-hover:#1C2A1F; --side-on:#22322A; --side-line:#26352A;
  --green:#9FD154; --deep:#B6E072; --deepfg:#14260A; --hover:#1F2D22;
  --blue:#7FB2F0; --bluebg:#14263D; --bluetx:#9CC5F5;
  --amber:#F5B84F; --amberbg:#2E2412; --ambertx:#F0C270;
  --err:#F0796B; --errbg:#2E1815;
  --violet:#9085E9; --violetbg:#231E3B; --violettx:#C2B9F5;
  --pink:#D55181; --pinkbg:#35192A; --pinktx:#F0A3C0;
  --teal:#5FD0BF; --tealbg:#12302B; --tealtx:#8FE3D6;
  --grey:#8C9884; --greybg:#243026;
  --st-backlog:#6F7C6B; --st-todo:#3987E5; --st-writing:#C98500; --st-peer:#D55181; --st-sme:#9085E9; --st-done:#008300;
  --s-created:#3987E5; --s-closed:#2E9E2E;
  --grid:#24322A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font)}
:focus-visible{outline:2px solid var(--annot);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--deep)}
#app{display:flex;height:100%}

/* sidebar */
.side{width:240px;flex:none;background:var(--side-bg);color:var(--side-tx);display:flex;flex-direction:column;padding:16px 12px;border-right:1px solid var(--side-line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.1;color:var(--brand)}
.brand small{display:block;color:var(--side-dim);font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--side-dim);cursor:pointer;text-align:left;font-weight:500}
.nav button .ic{width:18px;text-align:center;flex:none}
.nav button:hover{background:var(--side-hover);color:var(--side-tx)}
.nav button.on{background:var(--side-on);color:var(--side-tx);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06),inset 3px 0 0 var(--leaf)}
.nav .count{margin-left:auto;font:600 11px var(--mono);background:var(--leaf);color:#14260A;border-radius:10px;padding:0 7px}
.nav-h{display:flex;align-items:center;justify-content:space-between;font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--side-dim);padding:18px 10px 6px}
.nav .vw{font-size:13px;padding:6px 10px}
.nav .vw .star{color:var(--amber)}
.nav .vw .who{margin-left:auto;font-size:10.5px;color:var(--side-dim)}
.side .grow{flex:1;min-height:12px}
.side .me{border-top:1px solid var(--side-line);padding:12px 6px 0;font-size:12px;color:var(--side-dim)}
.side .me select{width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--side-line);color:var(--side-tx);border-radius:7px;padding:6px}
.side .me .row{margin-top:8px}
.side .me button{background:var(--panel);border:1px solid var(--side-line);color:var(--side-dim);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:12px}
.side .me button:hover{color:var(--side-tx);border-color:var(--deep)}
.scrim-side{display:none}

/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.top h1{font-size:20px;margin:0;font-weight:650;text-wrap:balance;letter-spacing:-.01em}
.top .crumbs{color:var(--muted);font-size:12px}
.top .crumbs a{color:var(--muted)}
.top .crumbs a:hover{color:var(--deep)}
.top .crumbs a{cursor:pointer;text-decoration:none}
.top .sp{flex:1}
.content{flex:1;overflow:auto;padding:20px 24px 40px}
.menu-btn{display:none}

/* atoms */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--deep);border-color:var(--deep);color:var(--deepfg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--err)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--greybg);color:var(--muted)}
.chip.green{background:var(--hover);color:var(--deep)}
.chip.blue{background:var(--bluebg);color:var(--bluetx)}
.chip.amber{background:var(--amberbg);color:var(--ambertx)}
.chip.red{background:var(--errbg);color:var(--err)}
.chip.violet{background:var(--violetbg);color:var(--violettx)}
.chip.teal{background:var(--tealbg);color:var(--tealtx)}
.chip.pink{background:var(--pinkbg);color:var(--pinktx)}
.key{font:600 12px var(--mono);color:var(--muted);white-space:nowrap}
.avatar{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;flex:none}
.avatar.lg{width:36px;height:36px;font-size:13px}
.avatar.none{background:var(--greybg)!important;color:var(--muted);border:1px dashed var(--grey)}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:16px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat>span{color:var(--muted);font-size:12px}
h2{font-size:15px;margin:0 0 10px}
h3{font:600 11px var(--mono);margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.empty{padding:28px;text-align:center;color:var(--muted)}
.prio{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.prio i{width:8px;height:8px;border-radius:2px;display:inline-block}
.overdue{color:var(--err);font-weight:600}
input.f,select.f,textarea.f{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;outline:none}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--deep);box-shadow:0 0 0 3px var(--hover)}
textarea.f{resize:vertical;min-height:80px}
label.l{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.field{margin-bottom:12px}
.req{color:var(--err)}
.err-msg{color:var(--err);font-size:12px;margin-top:3px}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters select,.filters input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 9px;max-width:200px}
.filters input{width:200px}

/* board */
.board{display:flex;gap:12px;align-items:flex-start;min-height:60vh;overflow-x:auto;padding-bottom:12px}
.col{flex:0 0 260px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:650;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.col-h .dot{width:8px;height:8px;border-radius:50%}
.col-b{padding:4px 8px 10px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--deep);outline-offset:-3px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tcard:hover{border-color:var(--deep)}
.tcard.dragging{opacity:.4}
.tcard .t{font-weight:550;margin:4px 0 8px}
.tcard .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.tcard .meta .sp{flex:1}

/* tables */
table.t{width:100%;border-collapse:collapse;background:var(--panel)}
table.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:650;padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--hover)}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}

/* progress */
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--greybg)}
.bar span{display:block;height:100%}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,8,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:520px}
.modal.wide{max-width:1060px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-size:16px;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--hover)}

/* task detail */
.td{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0}
.td-main{padding:18px 22px;border-right:1px solid var(--line);min-width:0}
.td-side{padding:18px;background:var(--panel2);border-bottom-right-radius:14px}
.td-title{font-size:20px;font-weight:650;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:0 -6px 10px;width:calc(100% + 12px);background:none}
.td-title:hover{border-color:var(--line)}
.td-title:focus{border-color:var(--deep);outline:none;background:var(--panel)}
.desc{white-space:pre-wrap;word-wrap:break-word;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:text;min-height:44px}
.desc:hover{border-color:var(--line)}
.prop{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:8px;margin-bottom:9px;font-size:13px}
.prop>span{color:var(--muted);font-size:12px;font-weight:600}
.prop select,.prop input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 7px;font-size:13px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:22px 0 14px}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--deep)}
.comment{display:flex;gap:10px;margin-bottom:14px}
.comment .body{flex:1;min-width:0}
.comment .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;white-space:pre-wrap;word-wrap:break-word;margin-top:4px}
.comment.q .bubble{background:var(--amberbg);border-color:var(--amber)}
.comment.q.resolved .bubble{background:var(--panel2);border-color:var(--line)}
.comment .acts{display:flex;gap:4px;margin-top:4px}
.comment .acts button{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 6px;border-radius:5px}
.comment .acts button:hover{background:var(--hover);color:var(--ink)}
.mention{color:var(--bluetx);background:var(--bluebg);border-radius:4px;padding:0 3px;font-weight:600}
.composer{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.composer textarea{border:0;width:100%;padding:10px 12px;min-height:70px;resize:vertical;outline:none;background:transparent}
.composer .bar2{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--deep);color:var(--deepfg)}
.act-item{display:flex;gap:8px;font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}
.checklist label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.checklist label.done span{text-decoration:line-through;color:var(--muted)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;font-size:13px}
/* filter toggles + saved views */
.tog{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12.5px;font-weight:550;color:var(--muted)}
.tog.on{background:var(--hover);border-color:var(--deep);color:var(--deep)}
.viewbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);font-size:13px}
.viewbar b{font-weight:650}

/* insights */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .lbl{font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-size:30px;font-weight:650;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .val small{font-size:15px;font-weight:600;color:var(--muted);margin-left:2px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .delta{font-weight:600}
.kpi .delta.up{color:var(--deep)}
.kpi .delta.down{color:var(--err)}
.chart-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.chart-card h2{margin-bottom:2px}
.chart-card .cap{color:var(--muted);font-size:12px;margin-bottom:12px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--muted);font:11px var(--font);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default}
.chart .bar-g:hover .mk{opacity:.82}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--panel)}
.stack span{display:block;height:100%;min-width:3px}
.st-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.st-table td{padding:5px 4px;border-bottom:1px solid var(--line)}
.st-table td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hbar{display:flex;align-items:center;gap:8px}
.hbar .trk{flex:1;height:8px;background:var(--greybg);border-radius:4px;overflow:hidden;display:flex;gap:2px}
.hbar .trk span{display:block;height:100%}
.hbar .trk span:last-child{border-radius:0 4px 4px 0}
.num{font-variant-numeric:tabular-nums;text-align:right}
table.t th.num,table.t td.num{text-align:right;padding-right:18px}
table.t th.num{white-space:nowrap}

@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2{grid-template-columns:1fr}

  .td-main{border-right:0}

}

<body>
<div id="app"></div>
<script>
"use strict";
/* =====================================================================
   Taskana (by GALIL) — project & task tracking for technical-writing teams.
   Standalone: no network, no build step. Data lives in localStorage.
   Ids for people, clients and projects follow the WorkDesk conventions
   (u-*, c-*, p-*) so the two apps can share records later.
   ===================================================================== */
var KEY = "galil-taskana-v1", OLD_KEYS = ["galil-folio-v1"];
var APP_VERSION = 1;

var STATUSES = [
  { k: "Backlog",     color: "var(--st-backlog)", chip: "" },
  { k: "To Do",       color: "var(--st-todo)",    chip: "blue" },
  { k: "Writing",     color: "var(--st-writing)", chip: "amber" },
  { k: "Peer Review", color: "var(--st-peer)",    chip: "pink" },
  { k: "SME Review",  color: "var(--st-sme)",     chip: "violet" },
  { k: "Done",        color: "var(--st-done)",    chip: "green" }
];
var TYPES = ["Writing", "Editing", "Review", "Illustration", "Translation", "Localization", "SME Interview", "Publishing", "Doc Defect", "Research"];
var TYPE_CHIP = { "Writing": "amber", "Editing": "violet", "Review": "violet", "Illustration": "teal", "Translation": "blue", "Localization": "blue", "SME Interview": "teal", "Publishing": "green", "Doc Defect": "red", "Research": "" };
var PRIORITIES = [
  { k: "Critical", color: "var(--err)" },
  { k: "High",     color: "var(--amber)" },
  { k: "Medium",   color: "var(--blue)" },
  { k: "Low",      color: "var(--grey)" }
];
var DOC_TYPES = ["User Manual", "Operator Manual", "Maintenance Manual", "Online Help", "API Reference", "Release Notes", "Training Courseware", "Quick Start Guide", "Knowledge Base", "Proposal", "Other"];
var PROJECT_STATUSES = ["Active", "On Hold", "Completed", "Archived"];
var AVATAR_COLORS = ["#5C8B22", "#3B7DD8", "#C0392B", "#7A5AC8", "#1F9A8A", "#D9822B", "#8E5B3E", "#2F6F4F", "#B03A7A", "#4A5A9A"];

/* ================= utilities ================= */
function uid(p) { return p + "-" + Math.random().toString(36).slice(2, 9); }
function nowISO() { return new Date().toISOString(); }
function d2s(d) { var m = d.getMonth() + 1, dd = d.getDate(); return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (dd < 10 ? "0" : "") + dd; }
function today() { return d2s(new Date()); }
function fmtDate(s) { if (!s) return "—"; var d = new Date(s.length === 10 ? s + "T00:00:00" : s); return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }
function fmtWhen(iso) {
  var d = new Date(iso), diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "just now";
  if (diff < 3600) return Math.floor(diff / 60) + " min ago";
  if (diff < 86400) return Math.floor(diff / 3600) + " h ago";
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + " d ago";
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function isOverdue(t) { return t.dueDate && t.status !== "Done" && t.dueDate < today(); }
function initials(name) { return (name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(function (s) { return s[0].toUpperCase(); }).join(""); }
function colorFor(id) { var h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return AVATAR_COLORS[h % AVATAR_COLORS.length]; }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }
function statusOf(k) { for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].k === k) return STATUSES[i]; return STATUSES[0]; }
function prioOf(k) { for (var i = 0; i < PRIORITIES.length; i++) if (PRIORITIES[i].k === k) return PRIORITIES[i]; return PRIORITIES[2]; }

/* tiny DOM builder: h(tag, props, ...children) — text is always set as text, never HTML */
function h(tag, props) {
  var el = document.createElement(tag);
  if (props) for (var k in props) {
    var v = props[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "value") el.value = v;
    else if (k === "checked" || k === "selected" || k === "disabled") el[k] = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
  return el;
}
function add(el, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(el, x); }); return; }
  el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}

function load() {
  try {
    var keys = [KEY].concat(OLD_KEYS);
    for (var i = 0; i < keys.length; i++) {
      var s = localStorage.getItem(keys[i]);

}
function isBackup(o) { return o && (o.app === "galil-taskana" || o.app === "galil-folio") && Array.isArray(o.tasks); }
/* bring older saves (including the app's earlier "Folio" name) up to the current shape */
function upgrade(o) {
  o.app = "galil-taskana"; o.views = o.views || [];
  o.tasks.forEach(function (t) { if (t.status === "Done" && !t.completedAt) t.completedAt = t.updatedAt; });
  return o;
}

  try { localStorage.setItem(KEY, JSON.stringify(db)); }

function me() { return byId(db.users, db.settings.currentUserId) || db.users[0]; }

    ["p-mob1", "API reference — endpoints A–F", "Writing", "Done", "Medium", "u-sen", "u-sen", T(-8), 30, "SDK 4.0", "Generate and hand-edit reference pages.", ["api"], [], -30],

  tasks.forEach(function (r, i) {

}

/* ================= routing ================= */
function setHash(h_) { try { history.replaceState(null, "", h_); } catch (e) {} }
function go(path) { location.hash = "#/" + path; }
function parseRoute() { ui.route = (location.hash.replace(/^#\/?/, "") || "home").split("/").map(decodeURIComponent); }
window.addEventListener("hashchange", function () { parseRoute(); enterRoute(); ui.sideOpen = false; render(); });
function enterRoute() { if (ui.route[0] === "view") { var v = byId(db.views, ui.route[1]); if (v) applyView(v); } }

/* ================= rendering ================= */
var root = document.getElementById("app");
function render() {
  hideTip();
  if (db.settings.theme) document.documentElement.setAttribute("data-theme", db.settings.theme);
  else document.documentElement.removeAttribute("data-theme");
  var scroll = root.querySelector(".content"), st = scroll ? scroll.scrollTop : 0;

function composer(t) {

  }

      h("div", { class: "seg" },
        h("button", { class: ui.composerKind === "comment" ? "on" : "", onclick: function () { ui.composerKind = "comment"; renderOverlay(); overlay.querySelector(".composer textarea").focus(); } }, "💬 Comment"),
        h("button", { class: ui.composerKind === "question" ? "on" : "", onclick: function () { ui.composerKind = "question"; renderOverlay(); overlay.querySelector(".composer textarea").focus(); } }, "? Question")),
      h("button", { class: "btn primary sm", onclick: post }, ui.composerKind === "question" ? "Ask" : "Post")));
}

/* ---------- modals (forms) ---------- */

var userOpts = function () { return db.users.filter(function (u) { return u.isActive; }).map(function (u) { return { value: u.id, label: u.fullName + " — " + u.jobTitle }; }); };

var _viewForm = FORMS.view;

function dataModal() {
  var file = h("input", { type: "file", accept: "application/json,.json", onchange: function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();

      try {
        var o = JSON.parse(r.result);
        if (!isBackup(o)) throw new Error("This file is not a Taskana backup.");
        confirmBox("Replace all data?", "Everything in this browser is replaced with the backup (" + o.tasks.length + " tasks, " + (o.projects || []).length + " projects).", "Restore", function () {
          db = upgrade(Object.assign(emptyDB(), o)); save(); ui.openTask = null; toast("Backup restored"); go("home"); render();
        });
      } catch (err) { toast(err.message); }
    };
    r.readAsText(f);
  } });
  return shell("Data & backup", h("div", null,
    h("p", { class: "muted", style: { marginTop: 0 } }, "Taskana keeps its data in this browser only. Download a backup to move it to another browser or keep a copy."),

        saveFile("taskana-backup-" + today() + ".json", JSON.stringify(Object.assign({}, db, { exported: nowISO() }), null, 2), "application/json", "Backup");
      } }, EMBEDDED ? "⧉ Copy backup" : "⬇ Download backup"),

        var csv = "﻿" + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? "" : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(","); }).join("\r\n");
        saveFile("taskana-tasks-" + today() + ".csv", csv, "text/csv", "Task CSV");

}

/* ---------- misc ---------- */
var toastTimer;
function toast(msg) {
  var old = document.querySelector(".toast"); if (old) old.remove();
  var el = h("div", { class: "toast", role: "status" }, msg); document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.remove(); }, 2600);
}
var EMBEDDED = (function () { try { return window.top !== window.self; } catch (e) { return true; } })();
function saveFile(name, text, type, what) {
  if (EMBEDDED) {
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast(what + " copied to the clipboard — paste it into a file"); }, function () { toast("Couldn't copy " + what.toLowerCase() + " here — open Taskana directly to download it."); });
    return;
  }
  var a = h("a", { href: URL.createObjectURL(new Blob([text], { type: type })), download: name }); document.body.appendChild(a); a.click(); a.remove();
}
function copy(text) {
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { toast("Link copied"); }, function () { toast(text); });
  else toast(text);
}
