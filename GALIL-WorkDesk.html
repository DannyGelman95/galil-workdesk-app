/* ================= styles ================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0}
.app{
  --teal:#17A3B8; --teal2:#7AD0DC;
  --red:#E05C4B; --yellow:#E3AC35; --sick:#9C8CE8; --vac:#3FA97E;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1100px 520px at 88% -12%, var(--soft), transparent 60%), var(--bg);
}
.app[data-theme="dark"]{
  --bg:#081A24; --panel:#0E2634; --panel2:#12303F; --field:#0A2130;
  --line:rgba(122,208,220,.16); --text:#EAF4F7; --muted:#87A5B2;
  --soft:rgba(23,163,184,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  --redT:#F08575; --yelT:#EDC25C; --sickT:#B4A7F0; --vacT:#5FC79C;
}
.app[data-theme="light"]{
  --bg:#EAF2F5; --panel:#FFFFFF; --panel2:#F1F7FA; --field:#F4F9FB;
  --line:#D5E4EA; --text:#0F2836; --muted:#5B7683;
  --soft:rgba(23,163,184,.12); --shadow:0 10px 24px rgba(15,40,54,.08);
  --redT:#B3402F; --yelT:#8F6512; --sickT:#5D4BB8; --vacT:#1E7A52;
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font-family:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.hspace{flex:1}
.sub{font-size:11px;color:var(--muted)}

/* ---- header ---- */
.hdr{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}
.brand{display:flex;align-items:center;gap:10px}
.bname{font-family:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:700;font-size:16px;letter-spacing:.18em;line-height:1}
.bsub{font-size:9px;color:var(--muted);letter-spacing:.34em;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:14px;margin-left:6px}
.tab{border:0;background:transparent;color:var(--muted);font:600 13px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:7px 14px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(23,163,184,.35)}
.ribbon{width:172px}
.rlab{display:flex;justify-content:space-between;font:600 9.5px 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.rbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.rbar span{display:block;height:100%}
.tbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer}
.tbtn:hover{background:var(--soft)}

/* ---- layout (adapts to the window — no horizontal scrollbars) ---- */
.content{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(272px,332px) minmax(0,1fr);gap:14px;padding:14px 18px 16px}
.content.one{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}
.ptitle{font-family:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:600;font-size:14px;white-space:nowrap}
.pbody{padding:12px 14px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
.pbody.dash{display:flex;flex-direction:column;overflow:hidden}
.pbody::-webkit-scrollbar,.ditems::-webkit-scrollbar,.bscroll::-webkit-scrollbar,.tscroll::-webkit-scrollbar,.ddl::-webkit-scrollbar,.filterrow::-webkit-scrollbar{width:6px;height:6px}
.pbody::-webkit-scrollbar-thumb,.ditems::-webkit-scrollbar-thumb,.bscroll::-webkit-scrollbar-thumb,.tscroll::-webkit-scrollbar-thumb,.ddl::-webkit-scrollbar-thumb,.filterrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* ---- form ---- */
.frow{margin-bottom:10px;min-width:0}
.frow.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hrow{display:flex;gap:8px;align-items:center;min-width:0}
.hrow.tight{gap:5px}
.colon{color:var(--muted);font-weight:600;flex:0 0 auto}
.lbl{display:block;font:600 9.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.lbl.cred{color:var(--redT)} .lbl.cyel{color:var(--yelT)}
.input{width:100%;height:36px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:0 12px;font:500 13px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-width:0}
.input::placeholder{color:var(--muted);opacity:.7}
textarea.input{height:52px;padding:8px 12px;resize:none}
.notice{background:rgba(224,92,75,.14);color:var(--redT);border-radius:10px;padding:7px 10px;font:500 12px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin-bottom:10px}

/* ---- spinner + dropdown ---- */
.spin{position:relative;display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;height:36px;padding:0 3px;cursor:ns-resize;user-select:none;min-width:0}
.spin.grow{flex:1;width:100%}
.valbtn{flex:1;min-width:0;height:100%;border:0;background:none;color:inherit;text-align:left;padding:0 0 0 9px;cursor:pointer;display:flex;align-items:center;border-radius:12px}
.spin .val{flex:1;min-width:0;font:500 13px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin.mono .val{font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.chevs{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.chev{width:20px;height:13px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:7px;line-height:1;padding:0}
.chev:hover{background:var(--soft);color:var(--teal)}
.ddl{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:1px}
.ddi{border:0;background:transparent;color:var(--text);text-align:left;font:500 12.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.ddi:hover{background:var(--soft)}
.ddi.on{background:var(--teal);color:#fff}

/* ---- buttons ---- */
.btn{height:38px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:600 13px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;padding:0 16px;width:100%;box-shadow:0 6px 16px rgba(23,163,184,.3);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;width:auto}
.btn.ghost:hover{color:var(--text);background:var(--soft)}
.btn.ghost.teal{color:var(--teal);border-color:var(--teal)}
.btn.ghost.half{flex:1}
.btn.ghost.wide{width:100%;margin-top:8px;height:34px;font-size:12px}
.btn.sm{height:28px;font-size:11px;padding:0 10px;border-radius:9px;white-space:nowrap}
.ib{width:36px;height:36px;flex:0 0 auto;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--teal);font-size:15px;cursor:pointer}
.ib:hover{background:var(--soft)}
.ib.txt{width:auto;padding:0 11px;font:600 11px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;border-style:solid;color:var(--muted)}
.ib.txt:hover{color:var(--teal)}
.mini{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.mini:hover{background:var(--soft);color:var(--teal)}

/* ---- segmented ---- */
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;min-width:0}
.seg.sm{padding:2px}
.segb{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 12px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;height:28px;border-radius:9px;cursor:pointer;white-space:nowrap;padding:0 10px;transition:background .15s,color .15s}
.seg.sm .segb{height:24px;font-size:11px}
.segb:hover{color:var(--text)}
.segb.on{background:var(--teal);color:#fff}
.segb.on.sick{background:var(--sick)}
.segb.on.vac{background:var(--vac)}
.segb.on.hred{background:var(--red)}
.segb.on.hyel{background:var(--yellow);color:#33270a}

/* ---- chips / list ---- */
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font:600 10.5px 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:nowrap;flex:0 0 auto}
.chip.big{height:24px;font-size:12px}
.chip.red{background:rgba(224,92,75,.16);color:var(--redT)}
.chip.yellow{background:rgba(227,172,53,.18);color:var(--yelT)}
.chip.sick{background:rgba(156,140,232,.18);color:var(--sickT)}
.chip.vac{background:rgba(63,169,126,.16);color:var(--vacT)}
.chip.teal{background:var(--soft);color:var(--teal)}
.chips{display:flex;gap:5px;flex:0 0 auto}
.totrow{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:4px}
.sum{font-size:12px;font-weight:600;color:var(--text)}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--panel2);min-width:0}
.idate{width:88px;flex:0 0 88px;display:flex;flex-direction:column;gap:1px}
.idate .d{font-size:12px;font-weight:600}
.imain{flex:1;min-width:0}
.ttl{font:600 13px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imain .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts{opacity:1}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 12px}
.thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}

/* ---- filter row (chips + spinners, scrolls sideways if cramped) ---- */
.filterrow{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto;align-items:center}
.flab{font:600 9px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.14em;color:var(--muted);flex:0 0 auto}
.vsep{width:1px;height:22px;background:var(--line);flex:0 0 auto;margin:0 2px}
.echip{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 11.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;height:26px;padding:0 12px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.echip:hover{color:var(--text)}
.echip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.filterrow .spin{height:30px}
.filterrow .spin .val{font-size:12px}

/* ---- attachments ---- */
.fwrap{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:9px;padding:3px 8px;font:500 11px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;max-width:100%}
.fchip{overflow:hidden}
.fthumb{width:20px;height:20px;border-radius:5px;object-fit:cover}
.fx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;padding:0}
.fx:hover{color:var(--redT)}

/* ---- week view ---- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;flex:1;min-height:0;padding:12px 14px}
.daycol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel2);min-height:0;min-width:0;cursor:pointer;overflow:hidden;transition:border-color .15s}
.daycol:hover{border-color:var(--teal2)}
.daycol.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);opacity:1}
.daycol.wknd{opacity:.55}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dnum{font-size:12px;font-weight:600;padding:1px 7px;border-radius:8px}
.daycol.today .dnum{background:var(--teal);color:#fff}
.ditems{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:0}
.dempty{color:var(--line);font-size:16px;text-align:center;margin-top:14px}
.pchip{position:relative;border-left:3px solid var(--teal);background:var(--soft);border-radius:8px;padding:4px 7px;cursor:pointer;min-width:0}
.pchip.sick{border-color:var(--sick)}
.pchip.vac{border-color:var(--vac)}
.pctop{font:600 11px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px;min-width:0}
.ptxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot.sm{width:5px;height:5px}
.pcsub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .x{position:absolute;top:2px;right:3px;border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer;opacity:0;padding:1px}
.pchip:hover .x{opacity:1}
.pchip .x:hover{color:var(--redT)}
.dsum{padding:5px 9px;border-top:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);text-align:right;min-height:25px;flex:0 0 auto}

/* ---- month view (each plan = dot + description line) ---- */
.mwrap{display:flex;flex-direction:column;flex:1;min-height:0;padding:10px 14px 14px}
.mdow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 0 6px;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.mcell{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:5px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:0;min-width:0;overflow:hidden;transition:border-color .15s}
.mcell:hover{border-color:var(--teal2)}
.mcell.out{opacity:.35}
.mcell.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.mcell.today .mtop .mono{color:var(--teal);font-weight:700}
.mtop{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex:0 0 auto}
.mlines{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.mline{position:relative;display:flex;align-items:center;gap:5px;font:500 10.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);white-space:nowrap;overflow:hidden;border-radius:6px;padding:1px 15px 1px 3px;cursor:pointer;min-width:0}
.mline:hover{background:var(--soft)}
.mline .mtxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mline .x{position:absolute;top:50%;transform:translateY(-50%);right:2px;border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer;opacity:0;padding:1px;line-height:1}
.mline:hover .x{opacity:1}
.mline .x:hover{color:var(--redT)}
.dot{width:6px;height:6px;border-radius:99px;background:var(--teal);flex:0 0 auto}
.dot.sick{background:var(--sick)}
.dot.vac{background:var(--vac)}

/* ---- dashboard ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:12px;flex:0 0 auto}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.clab{font:600 9px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cval{font:600 20px 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{font:600 9.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dtable td{padding:8px 12px;border-bottom:1px solid var(--line)}
.dtable tr:last-child td{border-bottom:0}
.dtable .num{text-align:right}
.legend{display:flex;gap:12px;margin-bottom:10px;flex:0 0 auto;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.bars2{display:grid;grid-template-columns:3fr 2fr;gap:16px;flex:1;min-height:0}
.bcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.btit{font:600 10px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bscroll{overflow-y:auto;min-height:0;flex:1;padding-right:4px}
.brow{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) minmax(70px,118px);gap:10px;align-items:center;margin-bottom:10px}
.brow.cli{grid-template-columns:minmax(80px,130px) minmax(0,1fr) 56px}
.bname2{font:600 12px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{display:flex;height:14px;border-radius:99px;background:var(--field);overflow:hidden}
.btrack span{height:100%}
.bval{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartwrap{flex:1;min-height:0}

/* ---- period pickers & popovers ---- */
.popwrap{position:relative;display:inline-flex}
.ptitle.click{border:0;background:none;color:var(--text);cursor:pointer;padding:3px 8px;border-radius:9px;font:600 14px 'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap}
.ptitle.click:hover{background:var(--soft);color:var(--teal)}
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px}
.pop .phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.pop .phd span{font:600 12.5px 'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap}
.mcal{display:grid;grid-template-columns:repeat(7,30px);gap:2px}
.mcal .dw{font:600 9px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--muted);text-align:center;padding:2px 0}
.mday{width:30px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--text);font:500 11.5px 'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;cursor:pointer;padding:0}
.mday:hover{background:var(--soft)}
.mday.out{color:var(--muted);opacity:.5}
.mday.today{color:var(--teal);font-weight:700}
.mday.on{background:var(--teal);color:#fff}
.mons{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.monb{height:30px;border:0;border-radius:9px;background:transparent;color:var(--text);font:500 12px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;padding:0 10px}
.monb:hover{background:var(--soft)}
.monb.on{background:var(--teal);color:#fff}
.pop.swatches{display:grid;grid-template-columns:repeat(4,26px);gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--text)}
.cchip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--muted);flex:0 0 auto}
.cdot{width:14px;height:14px;border-radius:99px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:0 0 auto}
.cdot:hover{box-shadow:0 0 0 2px var(--teal)}

/* ---- editing state & danger ---- */
.item{cursor:pointer}
.item.editing{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.btn.danger{background:transparent;color:var(--redT);border:1px solid rgba(224,92,75,.55);box-shadow:none}
.btn.danger:hover{background:rgba(224,92,75,.12);filter:none}
.btn.danger.wide{width:100%;margin-top:8px;height:34px;font-size:12px}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:9px 14px;font:500 12.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);display:flex;gap:12px;align-items:center}
.tundo{border:0;background:none;color:var(--teal);font:600 12.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;cursor:pointer;padding:0;text-decoration:underline}

/* ---- v3: plan vs actual ---- */
.vsrow{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) minmax(120px,168px);gap:10px;align-items:center;margin-bottom:12px}
.vstracks{display:flex;flex-direction:column;gap:3px;min-width:0}
.btrack.plan span{opacity:.4}

/* ---- v3: month-view weekend shading (Fri–Sat) ---- */
.mcell.wknd:not(.out){opacity:.55}

/* ---- v3: settings modal — lists & data ---- */
.overlay{position:fixed;inset:0;z-index:75;background:rgba(4,14,20,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(880px,100%);max-height:min(600px,94vh);display:flex;flex-direction:column;overflow:hidden}
.mgridcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 14px;flex:1;min-height:0}
.mcol2{display:flex;flex-direction:column;min-height:0;min-width:0}
.dlab{font:600 9.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mlist{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2)}
.mlist::-webkit-scrollbar{width:6px}
.mlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.mrow{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:8px;min-width:0}
.mrow:hover{background:var(--soft)}
.mname{flex:1;min-width:0;font:500 12.5px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow>.sub{flex:0 0 auto}
.mrow .mini{width:22px;height:22px;font-size:11px;opacity:0;flex:0 0 auto}
.mrow:hover .mini,.mrow .mini:focus-visible{opacity:1}
.mrow .input{height:30px;font-size:12px;padding:0 8px;border-radius:9px}
.notice.mnote{margin:0 14px 10px;flex:0 0 auto}
.dsec{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}

/* ---- v4: budgets ---- */
.budtrack{display:flex;height:10px;border-radius:99px;background:var(--field);overflow:hidden;margin:5px 0 4px;max-width:520px}
.budtrack span{height:100%;border-radius:99px;transition:width .2s}

/* ---- v4: export menu ---- */
.pop.expop{display:flex;flex-direction:column;gap:2px;padding:6px;min-width:215px}

/* ---- v4: add row in manage lists ---- */
.madd{border:1px dashed var(--line);background:transparent;color:var(--teal);font:600 11px 'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;height:26px;border-radius:8px;cursor:pointer;flex:0 0 auto;margin-bottom:2px}
.madd:hover{background:var(--soft)}

/* =================================================================
   v4.1 — responsive & touch layer
   Three tiers: wide desktop (the grid above), narrow window / tablet
   (<=900px, one column, page scrolls), phone (<=640px, stacked cards,
   44px tap targets, 16px inputs so iOS doesn't zoom on focus).
   ================================================================= */

html{-webkit-text-size-adjust:100%}
.app{min-height:100vh}
@supports(height:100dvh){.app{height:100dvh}}

/* ---- touch devices: hover-only affordances have to be visible ---- */
@media (hover:none){
  .acts{opacity:1}
  .mrow .mini{opacity:1}
  .pchip .x,.mline .x{opacity:.7}
  .mini{width:30px;height:30px;font-size:14px}
  .mrow .mini{width:26px;height:26px}
  .chev{height:15px;width:24px}
  .spin{cursor:pointer}
}

/* ---- narrow window / tablet ---- */
@media (max-width:900px){
  .app{height:auto;min-height:100vh;overflow:auto}
  @supports(height:100dvh){.app{height:auto;min-height:100dvh}}
  .content,.content.one{display:flex;flex-direction:column;grid-template-columns:none;
    overflow:visible;padding:12px 12px 16px;gap:12px}
  .panel{min-height:auto;flex:0 0 auto}
  .pbody,.pbody.dash{overflow:visible}
  .ribbon{display:none}
  .bars2{grid-template-columns:minmax(0,1fr);gap:14px}
  .mgridcols{grid-template-columns:repeat(2,minmax(0,1fr));overflow-y:auto}
  /* panels are content-height now, so flex:1 children need a floor */
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .daycol{min-height:136px}
  .ditems{overflow:visible}
  .mwrap{min-height:430px}
  .chartwrap{min-height:280px}
  .bscroll{overflow:visible}
  .tscroll{overflow:auto}
  .dtable{min-width:520px}
}

/* ---- phone ---- */
@media (max-width:640px){
  /* header: brand + buttons on one row, tabs swipe on the next */
  .hdr{padding:8px 12px;gap:8px}
  .brand svg{width:28px;height:24px}
  .bname{font-size:14px}
  .bsub{font-size:8px;letter-spacing:.28em}
  .tabs{order:5;flex:0 0 100%;margin-left:0;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 13px;font-size:12.5px}
  .tbtn{width:38px;height:38px}

  .content,.content.one{padding:10px 10px calc(14px + env(safe-area-inset-bottom));gap:10px}
  .phead{padding:9px 11px}
  .pbody{padding:11px 11px}
  .totrow,.filterrow{padding:8px 11px}

  /* tap targets + no iOS zoom-on-focus (needs >=16px) */
  .input,textarea.input{font-size:16px}
  .input{height:42px}
  textarea.input{height:60px}
  .spin{height:42px}
  .spin .val{font-size:14.5px}
  .filterrow .spin{height:34px}
  .filterrow .spin .val{font-size:13px}
  .btn{height:44px;font-size:14px}
  .btn.sm{height:32px;font-size:12px;padding:0 12px}
  .btn.ghost.wide,.btn.danger.wide{height:40px;font-size:13px}
  .ib{width:42px;height:42px;font-size:16px}
  .ib.txt{width:auto;padding:0 13px}
  .segb{height:34px;font-size:12.5px}
  .seg.sm .segb{height:30px;font-size:11.5px}
  .echip{height:30px;padding:0 13px}
  .ddi{padding:9px 11px;font-size:13.5px}
  .monb{height:34px}
  .mday{height:32px}

  /* list rows stack: date · title · chips + actions */
  .item{flex-wrap:wrap;align-items:flex-start;gap:8px;padding:10px 11px}
  .idate{flex:0 0 100%;width:auto;flex-direction:row;align-items:baseline;gap:8px}
  .imain{flex:1 1 100%;order:2}
  .ttl{white-space:normal}
  .imain .sub{white-space:normal}
  .chips{order:3;flex-wrap:wrap}
  .acts{order:4;margin-left:auto;gap:4px}

  /* week planner: one day per row */
  .week{grid-template-columns:minmax(0,1fr);padding:10px;gap:7px}
  .daycol{min-height:auto}
  .daycol.wknd{opacity:.7}
  .ditems{padding:6px;gap:5px}
  .dempty{margin-top:6px;font-size:13px}

  /* month grid stays a calendar — just tighter */
  .mwrap{padding:8px 10px 12px;min-height:400px}
  .mcell{padding:4px 5px;border-radius:10px}
  .mtop{font-size:11px}
  .mline{font-size:10px;padding:1px 12px 1px 2px}
  .mdow{gap:4px}
  .mgrid{gap:4px}

  /* dashboard */
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{padding:9px 10px}
  .cval{font-size:17px}
  .clab{font-size:8.5px}
  .brow{grid-template-columns:minmax(60px,84px) minmax(0,1fr) 62px;gap:8px;margin-bottom:9px}
  .brow.cli{grid-template-columns:minmax(60px,84px) minmax(0,1fr) 48px}
  .vsrow{grid-template-columns:minmax(60px,84px) minmax(0,1fr) 78px;gap:8px}
  .bname2{font-size:11.5px}
  .bval{font-size:10.5px}
  .legend{flex-wrap:wrap;gap:8px}
  .chartwrap{min-height:250px}
  .budtrack{max-width:none}

  /* overlays sized to the viewport */
  .pop,.ddl{max-width:calc(100vw - 16px)}
  .pop.expop{min-width:0;width:calc(100vw - 32px);max-width:280px}
  .overlay{padding:0}
  .modal{width:100%;max-width:none;height:100%;max-height:100vh;border-radius:0}
  @supports(height:100dvh){.modal{max-height:100dvh}}
  .mgridcols{grid-template-columns:minmax(0,1fr);gap:10px}
  .mlist{min-height:96px}
  .dsec{padding:10px 12px}
  .toast{left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom));
    transform:none;justify-content:space-between}
}

/* ---- very narrow (small Android / split view) ---- */
@media (max-width:380px){
  .frow.two{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .bname{font-size:13px}
}
`;
