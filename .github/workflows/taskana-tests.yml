name: Taskana tests

on:
  pull_request:
    paths:
      - "site/taskana/**"
      - "tests/taskana/**"
      - ".github/workflows/taskana-tests.yml"
  push:
    branches: [main]
    paths:
      - "site/taskana/**"
      - "tests/taskana/**"
      - ".github/workflows/taskana-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/taskana
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/taskana/package-lock.json

      - name: Syntax-check the app scripts
        run: for f in ../../site/taskana/js/*.js; do node --check "$f"; done

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "1"

      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: taskana-playwright-report
          path: tests/taskana/playwright-report
