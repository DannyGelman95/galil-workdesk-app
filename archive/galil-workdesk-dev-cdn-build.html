                          {r.lYellow > 0 && <span style={{ width: (r.lYellow / maxPv) * 100 + "%", background: "var(--yellow)" }} />}
                        </div>
                      </div>
                      <div className="bval mono">{fmt(r.logged)} / {fmt(r.planned)}h <span className="sub">{r.pct === null ? "unplanned" : `${r.pct}% of plan`}</span></div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </section>
        </main>
      )}

      {/* ---------- REQUEST ADDITIONAL HOURS ---------- */}
      {reqOpen && (
        <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) setReqOpen(false); }}>
          <div className="modal narrow" role="dialog" aria-modal="true" aria-label="Request additional hours">
            <div className="phead">
              <span className="ptitle">Request additional hours</span>
              <div className="hspace" />
              <button className="mini" onClick={() => setReqOpen(false)} aria-label="Close">✕</button>
            </div>
            <div className="pbody">
              <div className="frow"><label className="lbl">Who is asking</label>
                <Spinner grow options={data.assignees} value={rf.who} onChange={(v) => setRf((f) => ({ ...f, who: v }))} />
              </div>
              <div className="frow two">
                <div><label className="lbl">Client</label>
                  <Spinner grow options={data.clients} value={rf.client} onChange={(v) => setRf((f) => ({ ...f, client: v }))} />
                </div>
                <div><label className="lbl">Project</label>
                  <Spinner grow options={data.projects} value={rf.project} onChange={(v) => setRf((f) => ({ ...f, project: v }))} />
                </div>
              </div>
              <div className="frow"><label className="lbl">Extra hours needed</label>
                <input className="input mono" inputMode="decimal" placeholder="8" value={rf.hours} onChange={(e) => setRf((f) => ({ ...f, hours: e.target.value }))} />
              </div>
              <div className="frow"><label className="lbl">Why</label>
                <textarea className="input tarea" placeholder="What still needs to be finished?" value={rf.reason} onChange={(e) => setRf((f) => ({ ...f, reason: e.target.value }))} />
              </div>
              {(() => {
                const al = allowanceFor(rf.who, rf.client, rf.project);
                if (!al || !al.row) return null;
                const cap = num(al.row.hours);
                return <div className="sub" style={{ marginBottom: 8 }}>Currently {fmt(al.used)}h used{cap > 0 ? ` of ${fmt(cap)}h` : " · no personal cap"}.</div>;
              })()}
              {note && <div className="notice">{note}</div>}
              <button className="btn" onClick={submitReq}>Send request</button>
              <div className="sub" style={{ marginTop: 8 }}>The request waits in the Budgets tab for a manager. Approving it adds the hours to this person's allowance.</div>
            </div>
          </div>
        </div>
      )}

      {/* ---------- SETTINGS — lists & data ---------- */}
      {settingsOpen && (
        <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) setSettingsOpen(false); }}>
          <div className="modal" role="dialog" aria-modal="true" aria-label="Lists and data">
            <div className="phead">
              <span className="ptitle">Lists & data</span>
              <span className="sub">add here or in the forms · renaming updates every record · removing keeps history{isAdmin ? "" : " · renaming and removing clients & projects is for managers"}</span>
              {pendingVerif.length > 0 && <span className="stchip yellow" title="Clients or projects added by employees, waiting for a manager to verify">{pendingVerif.length} awaiting verification</span>}
              <div className="hspace" />
              <button className="mini" onClick={() => setSettingsOpen(false)} aria-label="Close">✕</button>
            </div>
            <div className="mgridcols">
              <ManageList title="Clients" items={data.clients} usage={(n) => usageCount("clients", n)} onAdd={(v) => addTo("clients", v)} addLabel="New client name" onRename={(o, v) => renameIn("clients", o, v)} onRemove={(n) => removeIn("clients", n)} verifiedOf={(n) => verifiedOf("clients", n)} onVerify={(n, v) => setVerified("clients", n, v)} canEdit={isAdmin} />
              <ManageList title="Projects" items={data.projects} usage={(n) => usageCount("projects", n)} onAdd={(v) => addTo("projects", v)} addLabel="New project name" onRename={(o, v) => renameIn("projects", o, v)} onRemove={(n) => removeIn("projects", n)} statusOf={pstatusOf} onStatus={setPStatus} verifiedOf={(n) => verifiedOf("projects", n)} onVerify={(n, v) => setVerified("projects", n, v)} canEdit={isAdmin} />
              <ManageList title="People" items={data.assignees} usage={(n) => usageCount("assignees", n)} onAdd={(v) => addTo("assignees", v)} addLabel="Full name" onRename={(o, v) => renameIn("assignees", o, v)} onRemove={(n) => removeIn("assignees", n)} />
              <ManageList title="Expense types" items={data.etypes} usage={(n) => usageCount("etypes", n)} onAdd={(v) => addTo("etypes", v)} addLabel="New type" onRename={(o, v) => renameIn("etypes", o, v)} onRemove={(n) => removeIn("etypes", n)} />
            </div>
            {note && <div className="notice mnote">{note}</div>}
            <div className="dsec">
              <div>
                <div className="dlab">Backup</div>
                <div className="sub">{data.entries.length} entries · {data.plans.length} plans · {data.expenses.length} expenses on this device</div>
              </div>
              <div className="hspace" />
              <button className="btn ghost sm" onClick={() => listsRef.current && listsRef.current.click()} title="Merge predefined clients, projects, people and expense types from a JSON file">⬆ Import lists</button>
              <input ref={listsRef} type="file" accept=".json,application/json" hidden onChange={(e) => { importLists(e.target.files && e.target.files[0]); e.target.value = ""; }} />
              <button className="btn ghost sm teal" onClick={exportBackup}>⬇ Download backup</button>
              <button className="btn ghost sm" onClick={() => restoreRef.current && restoreRef.current.click()}>⬆ Restore backup</button>
              <input ref={restoreRef} type="file" accept=".json,application/json" hidden onChange={(e) => { importBackup(e.target.files && e.target.files[0]); e.target.value = ""; }} />
              {isAdmin && (
                <>
                  <span className="vsep" />
                  <span className="chip teal">ADMIN unlocked</span>
                  <input className="input mono" style={{ width: 150, flex: "0 0 auto", height: 32 }} type="password" placeholder="New PIN" value={pinNew} onChange={(e) => setPinNew(e.target.value)} />
                  <button className="btn ghost sm" onClick={changePin}>Change PIN</button>
                  <button className="btn ghost sm" onClick={() => { setIsAdmin(false); flash("Admin locked."); }}>Lock admin</button>
                </>
              )}
            </div>
          </div>
        </div>
      )}

      {undo && (
        <div className="toast">
          {undo.label}
          <button className="tundo" onClick={() => { undo.restore(); setUndo(null); clearTimeout(undoTimer.current); }}>Undo</button>
        </div>
      )}
    </div>
  );
}

/* ================= styles ================= */
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
*{box-sizing:border-box}
html,body,#root{height:100%}
body{margin:0}
.app{
  --teal:#17A3B8; --teal2:#7AD0DC;
  --red:#E05C4B; --yellow:#E3AC35; --sick:#9C8CE8; --vac:#3FA97E;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1100px 520px at 88% -12%, var(--soft), transparent 60%), var(--bg);
}
.app[data-theme="dark"]{
  --bg:#081A24; --panel:#0E2634; --panel2:#12303F; --field:#0A2130;
  --line:rgba(122,208,220,.16); --text:#EAF4F7; --muted:#87A5B2;
  --soft:rgba(23,163,184,.14); --shadow:0 10px 30px rgba(0,0,0,.35);
  --redT:#F08575; --yelT:#EDC25C; --sickT:#B4A7F0; --vacT:#5FC79C;
}
.app[data-theme="light"]{
  --bg:#EAF2F5; --panel:#FFFFFF; --panel2:#F1F7FA; --field:#F4F9FB;
  --line:#D5E4EA; --text:#0F2836; --muted:#5B7683;
  --soft:rgba(23,163,184,.12); --shadow:0 10px 24px rgba(15,40,54,.08);
  --redT:#B3402F; --yelT:#8F6512; --sickT:#5D4BB8; --vacT:#1E7A52;
}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button{font-family:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.hspace{flex:1}
.sub{font-size:11px;color:var(--muted)}

/* ---- header ---- */
.hdr{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}
.brand{display:flex;align-items:center;gap:10px}
.bname{font-family:'Space Grotesk';font-weight:700;font-size:16px;letter-spacing:.18em;line-height:1}
.bsub{font-size:9px;color:var(--muted);letter-spacing:.34em;text-transform:uppercase;margin-top:3px}
.tabs{display:flex;gap:4px;background:var(--panel2);padding:4px;border-radius:14px;margin-left:6px}
.tab{border:0;background:transparent;color:var(--muted);font:600 13px 'Inter';padding:7px 14px;border-radius:10px;cursor:pointer;transition:background .2s,color .2s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--teal);color:#fff;box-shadow:0 4px 12px rgba(23,163,184,.35)}
.ribbon{width:172px}
.rlab{display:flex;justify-content:space-between;font:600 9.5px 'IBM Plex Mono';color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.rbar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--panel2)}
.rbar span{display:block;height:100%}
.tbtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;cursor:pointer}
.tbtn:hover{background:var(--soft)}

/* ---- layout (adapts to the window — no horizontal scrollbars) ---- */
.content{flex:1;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(272px,332px) minmax(0,1fr);gap:14px;padding:14px 18px 16px}
.content.one{grid-template-columns:minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.phead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}
.ptitle{font-family:'Space Grotesk';font-weight:600;font-size:14px;white-space:nowrap}
.pbody{padding:12px 14px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0}
.pbody.dash{display:flex;flex-direction:column;overflow:hidden}
.pbody::-webkit-scrollbar,.ditems::-webkit-scrollbar,.bscroll::-webkit-scrollbar,.tscroll::-webkit-scrollbar,.ddl::-webkit-scrollbar,.filterrow::-webkit-scrollbar{width:6px;height:6px}
.pbody::-webkit-scrollbar-thumb,.ditems::-webkit-scrollbar-thumb,.bscroll::-webkit-scrollbar-thumb,.tscroll::-webkit-scrollbar-thumb,.ddl::-webkit-scrollbar-thumb,.filterrow::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

/* ---- form ---- */
.frow{margin-bottom:10px;min-width:0}
.frow.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hrow{display:flex;gap:8px;align-items:center;min-width:0}
.hrow.tight{gap:5px}
.colon{color:var(--muted);font-weight:600;flex:0 0 auto}
.lbl{display:block;font:600 9.5px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.lbl.cred{color:var(--redT)} .lbl.cyel{color:var(--yelT)}
.input{width:100%;height:36px;background:var(--field);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:0 12px;font:500 13px 'Inter';min-width:0}
.input::placeholder{color:var(--muted);opacity:.7}
textarea.input{height:52px;padding:8px 12px;resize:none}
.notice{background:rgba(224,92,75,.14);color:var(--redT);border-radius:10px;padding:7px 10px;font:500 12px 'Inter';margin-bottom:10px}

/* ---- spinner + dropdown ---- */
.spin{position:relative;display:flex;align-items:center;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;height:36px;padding:0 3px;cursor:ns-resize;user-select:none;min-width:0}
.spin.grow{flex:1;width:100%}
.valbtn{flex:1;min-width:0;height:100%;border:0;background:none;color:inherit;text-align:left;padding:0 0 0 9px;cursor:pointer;display:flex;align-items:center;border-radius:12px}
.spin .val{flex:1;min-width:0;font:500 13px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spin.mono .val{font-family:'IBM Plex Mono'}
.chevs{display:flex;flex-direction:column;gap:1px;flex:0 0 auto}
.chev{width:20px;height:13px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:7px;line-height:1;padding:0}
.chev:hover{background:var(--soft);color:var(--teal)}
.ddl{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:1px}
.ddi{border:0;background:transparent;color:var(--text);text-align:left;font:500 12.5px 'Inter';padding:6px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.ddi:hover{background:var(--soft)}
.ddi.on{background:var(--teal);color:#fff}

/* ---- buttons ---- */
.btn{height:38px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:600 13px 'Inter';cursor:pointer;padding:0 16px;width:100%;box-shadow:0 6px 16px rgba(23,163,184,.3);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;width:auto}
.btn.ghost:hover{color:var(--text);background:var(--soft)}
.btn.ghost.teal{color:var(--teal);border-color:var(--teal)}
.btn.ghost.half{flex:1}
.btn.ghost.wide{width:100%;margin-top:8px;height:34px;font-size:12px}
.btn.sm{height:28px;font-size:11px;padding:0 10px;border-radius:9px;white-space:nowrap}
.ib{width:36px;height:36px;flex:0 0 auto;border-radius:12px;border:1px dashed var(--line);background:transparent;color:var(--teal);font-size:15px;cursor:pointer}
.ib:hover{background:var(--soft)}
.ib.txt{width:auto;padding:0 11px;font:600 11px 'Inter';border-style:solid;color:var(--muted)}
.ib.txt:hover{color:var(--teal)}
.mini{width:26px;height:26px;flex:0 0 auto;border-radius:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.mini:hover{background:var(--soft);color:var(--teal)}

/* ---- segmented ---- */
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;min-width:0}
.seg.sm{padding:2px}
.segb{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 12px 'Inter';height:28px;border-radius:9px;cursor:pointer;white-space:nowrap;padding:0 10px;transition:background .15s,color .15s}
.seg.sm .segb{height:24px;font-size:11px}
.segb:hover{color:var(--text)}
.segb.on{background:var(--teal);color:#fff}
.segb.on.sick{background:var(--sick)}
.segb.on.vac{background:var(--vac)}
.segb.on.hred{background:var(--red)}
.segb.on.hyel{background:var(--yellow);color:#33270a}

/* ---- chips / list ---- */
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;font:600 10.5px 'IBM Plex Mono';white-space:nowrap;flex:0 0 auto}
.chip.big{height:24px;font-size:12px}
.chip.red{background:rgba(224,92,75,.16);color:var(--redT)}
.chip.yellow{background:rgba(227,172,53,.18);color:var(--yelT)}
.chip.sick{background:rgba(156,140,232,.18);color:var(--sickT)}
.chip.vac{background:rgba(63,169,126,.16);color:var(--vacT)}
.chip.teal{background:var(--soft);color:var(--teal)}
.chips{display:flex;gap:5px;flex:0 0 auto}
.totrow{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:4px}
.sum{font-size:12px;font-weight:600;color:var(--text)}
.item{display:flex;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--panel2);min-width:0}
.idate{width:88px;flex:0 0 88px;display:flex;flex-direction:column;gap:1px}
.idate .d{font-size:12px;font-weight:600}
.imain{flex:1;min-width:0}
.ttl{font:600 13px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imain .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.item:hover .acts{opacity:1}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 12px}
.thumb{width:30px;height:30px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:0 0 auto}

/* ---- filter row (chips + spinners, scrolls sideways if cramped) ---- */
.filterrow{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);overflow-x:auto;flex:0 0 auto;align-items:center}
.flab{font:600 9px 'Inter';letter-spacing:.14em;color:var(--muted);flex:0 0 auto}
.vsep{width:1px;height:22px;background:var(--line);flex:0 0 auto;margin:0 2px}
.echip{border:1px solid var(--line);background:transparent;color:var(--muted);font:600 11.5px 'Inter';height:26px;padding:0 12px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.echip:hover{color:var(--text)}
.echip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.filterrow .spin{height:30px}
.filterrow .spin .val{font-size:12px}

/* ---- attachments ---- */
.fwrap{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:9px;padding:3px 8px;font:500 11px 'Inter';max-width:100%}
.fchip{overflow:hidden}
.fthumb{width:20px;height:20px;border-radius:5px;object-fit:cover}
.fx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;padding:0}
.fx:hover{color:var(--redT)}

/* ---- week view ---- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;flex:1;min-height:0;padding:12px 14px}
.daycol{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;background:var(--panel2);min-height:0;min-width:0;cursor:pointer;overflow:hidden;transition:border-color .15s}
.daycol:hover{border-color:var(--teal2)}
.daycol.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);opacity:1}
.daycol.wknd{opacity:.55}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dnum{font-size:12px;font-weight:600;padding:1px 7px;border-radius:8px}
.daycol.today .dnum{background:var(--teal);color:#fff}
.ditems{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:0}
.dempty{color:var(--line);font-size:16px;text-align:center;margin-top:14px}
.pchip{position:relative;border-left:3px solid var(--teal);background:var(--soft);border-radius:8px;padding:4px 7px;cursor:pointer;min-width:0}
.pchip.sick{border-color:var(--sick)}
.pchip.vac{border-color:var(--vac)}
.pctop{font:600 11px 'Inter';white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:4px;min-width:0}
.ptxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.dot.sm{width:5px;height:5px}
.pcsub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .x{position:absolute;top:2px;right:3px;border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer;opacity:0;padding:1px}
.pchip:hover .x{opacity:1}
.pchip .x:hover{color:var(--redT)}
.dsum{padding:5px 9px;border-top:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);text-align:right;min-height:25px;flex:0 0 auto}

/* ---- month view (each plan = dot + description line) ---- */
.mwrap{display:flex;flex-direction:column;flex:1;min-height:0;padding:10px 14px 14px}
.mdow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding:0 0 6px;text-align:center}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:6px;flex:1;min-height:0}
.mcell{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:5px 7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:0;min-width:0;overflow:hidden;transition:border-color .15s}
.mcell:hover{border-color:var(--teal2)}
.mcell.out{opacity:.35}
.mcell.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.mcell.today .mtop .mono{color:var(--teal);font-weight:700}
.mtop{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;flex:0 0 auto}
.mlines{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.mline{position:relative;display:flex;align-items:center;gap:5px;font:500 10.5px 'Inter';color:var(--text);white-space:nowrap;overflow:hidden;border-radius:6px;padding:1px 15px 1px 3px;cursor:pointer;min-width:0}
.mline:hover{background:var(--soft)}
.mline .mtxt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.mline .x{position:absolute;top:50%;transform:translateY(-50%);right:2px;border:0;background:none;color:var(--muted);font-size:9px;cursor:pointer;opacity:0;padding:1px;line-height:1}
.mline:hover .x{opacity:1}
.mline .x:hover{color:var(--redT)}
.dot{width:6px;height:6px;border-radius:99px;background:var(--teal);flex:0 0 auto}
.dot.sick{background:var(--sick)}
.dot.vac{background:var(--vac)}

/* ---- dashboard ---- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:12px;flex:0 0 auto}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.clab{font:600 9px 'Inter';letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cval{font:600 20px 'IBM Plex Mono';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csub{font-size:10.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tscroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:14px}
.dtable{width:100%;border-collapse:collapse;font-size:12.5px}
.dtable th{font:600 9.5px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dtable td{padding:8px 12px;border-bottom:1px solid var(--line)}
.dtable tr:last-child td{border-bottom:0}
.dtable .num{text-align:right}
.legend{display:flex;gap:12px;margin-bottom:10px;flex:0 0 auto;align-items:center}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.bars2{display:grid;grid-template-columns:3fr 2fr;gap:16px;flex:1;min-height:0}
.bcol{display:flex;flex-direction:column;min-height:0;min-width:0}
.btit{font:600 10px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.bscroll{overflow-y:auto;min-height:0;flex:1;padding-right:4px}
.brow{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) minmax(70px,118px);gap:10px;align-items:center;margin-bottom:10px}
.brow.cli{grid-template-columns:minmax(80px,130px) minmax(0,1fr) 56px}
.bname2{font:600 12px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{display:flex;height:14px;border-radius:99px;background:var(--field);overflow:hidden}
.btrack span{height:100%}
.bval{font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chartwrap{flex:1;min-height:0}

/* ---- period pickers & popovers ---- */
.popwrap{position:relative;display:inline-flex}
.ptitle.click{border:0;background:none;color:var(--text);cursor:pointer;padding:3px 8px;border-radius:9px;font:600 14px 'Space Grotesk';white-space:nowrap}
.ptitle.click:hover{background:var(--soft);color:var(--teal)}
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px}
.pop .phd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.pop .phd span{font:600 12.5px 'Space Grotesk';white-space:nowrap}
.mcal{display:grid;grid-template-columns:repeat(7,30px);gap:2px}
.mcal .dw{font:600 9px 'Inter';color:var(--muted);text-align:center;padding:2px 0}
.mday{width:30px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--text);font:500 11.5px 'IBM Plex Mono';cursor:pointer;padding:0}
.mday:hover{background:var(--soft)}
.mday.out{color:var(--muted);opacity:.5}
.mday.today{color:var(--teal);font-weight:700}
.mday.on{background:var(--teal);color:#fff}
.mons{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.monb{height:30px;border:0;border-radius:9px;background:transparent;color:var(--text);font:500 12px 'Inter';cursor:pointer;padding:0 10px}
.monb:hover{background:var(--soft)}
.monb.on{background:var(--teal);color:#fff}
.pop.swatches{display:grid;grid-template-columns:repeat(4,26px);gap:6px}
.sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;padding:0}
.sw:hover{transform:scale(1.08)}
.sw.on{border-color:var(--text)}
.cchip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px 'Inter';color:var(--muted);flex:0 0 auto}
.cdot{width:14px;height:14px;border-radius:99px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;flex:0 0 auto}
.cdot:hover{box-shadow:0 0 0 2px var(--teal)}

/* ---- editing state & danger ---- */
.item{cursor:pointer}
.item.editing{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.btn.danger{background:transparent;color:var(--redT);border:1px solid rgba(224,92,75,.55);box-shadow:none}
.btn.danger:hover{background:rgba(224,92,75,.12);filter:none}
.btn.danger.wide{width:100%;margin-top:8px;height:34px;font-size:12px}

/* ---- toast ---- */
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:80;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;padding:9px 14px;font:500 12.5px 'Inter';color:var(--text);display:flex;gap:12px;align-items:center}
.tundo{border:0;background:none;color:var(--teal);font:600 12.5px 'Inter';cursor:pointer;padding:0;text-decoration:underline}

/* ---- v3: plan vs actual ---- */
.vsrow{display:grid;grid-template-columns:minmax(80px,130px) minmax(0,1fr) minmax(120px,168px);gap:10px;align-items:center;margin-bottom:12px}
.vstracks{display:flex;flex-direction:column;gap:3px;min-width:0}
.btrack.plan span{opacity:.4}

/* ---- v3: month-view weekend shading (Fri–Sat) ---- */
.mcell.wknd:not(.out){opacity:.55}

/* ---- v3: settings modal — lists & data ---- */
.overlay{position:fixed;inset:0;z-index:75;background:rgba(4,14,20,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(1180px,100%);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.mgridcols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 14px;flex:1;min-height:0}
.mcol2{display:flex;flex-direction:column;min-height:0;min-width:0}
.dlab{font:600 9.5px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.mlist{flex:1;min-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--panel2)}
.mlist::-webkit-scrollbar{width:6px}
.mlist::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.mrow{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:8px;min-width:0}
.mrow:hover{background:var(--soft)}
.mname{flex:1;min-width:0;font:500 12.5px 'Inter';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow>.sub{flex:0 0 auto}
.mrow .mini{width:22px;height:22px;font-size:11px;opacity:0;flex:0 0 auto}
.mrow:hover .mini,.mrow .mini:focus-visible{opacity:1}
.mrow .input{height:30px;font-size:12px;padding:0 8px;border-radius:9px}
.notice.mnote{margin:0 14px 10px;flex:0 0 auto}
.dsec{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap;row-gap:6px}

/* ---- v4: budgets ---- */
.budtrack{display:flex;height:10px;border-radius:99px;background:var(--field);overflow:hidden;margin:5px 0 4px;max-width:520px}
.budtrack span{height:100%;border-radius:99px;transition:width .2s}

/* ---- v4: export menu ---- */
.pop.expop{display:flex;flex-direction:column;gap:2px;padding:6px;min-width:215px}

/* ---- v4: add row in manage lists ---- */
.madd{border:1px dashed var(--line);background:transparent;color:var(--teal);font:600 11px 'Inter';height:26px;border-radius:8px;cursor:pointer;flex:0 0 auto;margin-bottom:2px}
.madd:hover{background:var(--soft)}

/* ---- v6 ---- */
.modal.narrow{width:min(460px,100%);max-height:94vh}
.modal.narrow .pbody{overflow-y:auto}
.allocs{display:flex;flex-direction:column;gap:3px;margin-top:6px;border:1px solid var(--line);border-radius:11px;padding:6px;background:var(--panel2)}
.allocrow{display:flex;align-items:center;gap:7px;padding:2px 5px;border-radius:8px;min-width:0}
.allocrow:hover{background:var(--soft)}
.allocrow .mini{width:22px;height:22px;font-size:11px;flex:0 0 auto}
.reqbox{border:1px solid var(--yellow);border-radius:14px;padding:8px 10px 4px;margin-bottom:10px;background:var(--panel2)}
.reqbox .dlab{margin-bottom:4px}
.reqbox .item{background:transparent}

/* ---- v5 ---- */
.spin.err,.hrow.err,.input.err{border-color:var(--red)!important;box-shadow:0 0 0 1px var(--red) inset!important}
.cerr{color:var(--redT)!important}
.errbox .btn.ghost{border-color:var(--red)}
.hoursout{display:flex;align-items:center;gap:9px;min-height:38px;padding:4px 12px;border:1px solid var(--line);border-radius:12px;background:var(--field);flex:1;min-width:0;flex-wrap:wrap}
.hoursout .hv{font-size:15px;font-weight:600}
.hoursout.red .hv{color:var(--redT)}
.hoursout.yellow .hv{color:var(--yelT)}
.stchip{display:inline-flex;align-items:center;gap:4px;font:600 10px 'Inter',system-ui,sans-serif;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:transparent;margin-left:6px;white-space:nowrap;vertical-align:middle}
button.stchip{cursor:pointer}
button.stchip:hover{filter:brightness(1.15)}
.stchip.teal{color:var(--teal);border-color:var(--teal)}
.stchip.yellow{color:var(--yelT);border-color:var(--yellow)}
.stchip.sick{color:var(--sickT);border-color:var(--sick)}
.stchip.vac{color:var(--vacT);border-color:var(--vac)}
.stchip.red{color:var(--redT);border-color:var(--red)}
.stchip.muted{color:var(--muted);border-color:var(--line)}
.irowchips{display:flex;flex-wrap:wrap;gap:3px 0;margin-top:3px;margin-left:-6px}
.mini.ok{color:var(--vacT);border-color:var(--vac)}
.empsel{display:inline-flex;align-items:center;gap:6px}
.empsel-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.pop.inmodal{z-index:95}
.dbtns{display:flex;gap:3px;flex:0 0 auto}
.lockwrap{display:flex;align-items:center;justify-content:center}
.lockbox{max-width:440px;display:flex;flex-direction:column;gap:10px;text-align:center;align-items:center;padding:34px 10px}
.lockbox .hrow{width:100%}
.lockicon{font-size:34px}
.sub.dim{opacity:.75}
.ncard .nbody{font:400 12.5px 'Inter',system-ui,sans-serif;color:var(--muted);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:3px 0}
.nimgs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.nimgs img{height:52px;border-radius:8px;border:1px solid var(--line)}
.tagchip{display:inline-flex;font:600 10px 'Inter',system-ui,sans-serif;color:var(--teal);background:var(--soft);padding:2px 7px;border-radius:99px;margin-right:4px;margin-top:2px}
.tarea{min-height:96px;resize:vertical;padding-top:9px;line-height:1.45}

@media (max-width:900px){
  .content,.content.one{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .mgridcols{grid-template-columns:repeat(2,minmax(0,1fr));overflow-y:auto}
  .app{overflow:auto;height:auto;min-height:100vh}
  .ribbon{display:none}
  .bars2{grid-template-columns:minmax(0,1fr)}
}
`;

  </script>

  <script type="module">
    window.storage = {
      async get(key) {
        try {
          const v = localStorage.getItem(key);
          return v === null ? null : { key, value: v };
        } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(key, value); return { key, value }; }
        catch (e) { return null; }
      },
    };

    async function loadBabel() {
      try {
        const ns = await import("https://esm.sh/@babel/standalone@7.25.6");
        const B = typeof ns.transform === "function" ? ns : ns.default;
        if (B && typeof B.transform === "function") return B;
      } catch (e) { console.warn("Babel ESM import failed, trying classic <script> fallback…", e); }
      await new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("Could not load the JSX transpiler from esm.sh or unpkg."));
        document.head.appendChild(s);
      });
      if (window.Babel && typeof window.Babel.transform === "function") return window.Babel;
      throw new Error("Babel failed to load from both esm.sh and unpkg.");
    }

    const boot = document.getElementById("boot");
    try {
      const Babel = await loadBabel();
      const src = document.getElementById("app-source").textContent;
      const { code } = Babel.transform(src, {
        presets: [["react", { runtime: "automatic" }]],
        filename: "galil-workdesk.jsx",
        sourceType: "module",
      });
      const blob = new Blob([code], { type: "text/javascript" });
      const url = URL.createObjectURL(blob);
      const mod = await import(url);
      URL.revokeObjectURL(url);

      const React = await import("react");
      const { createRoot } = await import("react-dom/client");
      const App = mod.default;

      boot.remove();
      createRoot(document.getElementById("root")).render(React.createElement(App));
    } catch (err) {
      boot.innerHTML = "";
      const t = document.createElement("div");
      t.textContent = "GALIL WorkDesk couldn't start.";
      const e = document.createElement("div");
      e.className = "err";
      e.textContent = (err && err.stack) || String(err);
      const h = document.createElement("div");
      h.style.cssText = "font-size:12px;opacity:.75;max-width:480px";
      h.textContent = "This app needs an internet connection the first time it loads (to fetch React and a JSX tool from a CDN) — after that it works fully offline. Try reloading, or check your network / firewall settings.";
      boot.appendChild(t); boot.appendChild(e); boot.appendChild(h);
      boot.style.position = "fixed";
      console.error(err);
    }
  </script>
