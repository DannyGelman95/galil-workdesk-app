  <script id="app-source" type="text/plain">
import { useState, useEffect, useRef } from "react";
import { AreaChart, Area, XAxis, YAxis, Tooltip, CartesianGrid, ResponsiveContainer } from "recharts";

/* ================= helpers & constants ================= */
/* v6 — status field + clickable status chips on entries, per-employee project
   assignments with hour allowances, "Request additional hours" workflow with
   manager approval, manager-only editing of clients & projects with a
   verification queue for employee-added ones, Today button on expenses,
   roomier Lists & data window.
   v5 — project statuses + budget-usage indicators, filters on every tab,
   admin PIN gate on Budgets, 9h/12h work-day rule with approvals, mandatory
   fields with red-border highlights, meal expenses require evidence, pricing
   bases (Money/Hours/Pages/Words/Custom) + Work Orders, employee dropdown
   filters, a Library tab for technical-writing materials, derived hours field.
   v4 — styled Excel writer, view/all export choice, ⚙ add & import, Budgets.
   v3 — Plan vs actual, Copy week, Manage lists, Backup & restore, polish. */
const KEY = "galil-workdesk-v1"; // unchanged — existing data carries over
const pad = (n) => String(n).padStart(2, "0");
const d2s = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const s2d = (s) => { const [y, m, dd] = s.split("-").map(Number); return new Date(y, m - 1, dd); };
const todayStr = () => d2s(new Date());
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmtNice = (s) => { const d = s2d(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const uid = () => Math.random().toString(36).slice(2, 10);
const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const fmt = (v) => { const n = num(v); return n % 1 ? n.toFixed(1) : String(n); };
const r1 = (n) => Math.round(n * 10) / 10;
const t2m = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const rng = (a, b, step = 1) => { const out = []; for (let i = a; i <= b + 1e-9; i += step) out.push(i); return out; };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

const HOUR_OPTS = rng(0, 23).map(pad);
const MIN_OPTS = rng(0, 55, 5).map(pad);
const HRS_OPTS = rng(0, 12, 0.5).map((n) => (n % 1 ? n.toFixed(1) : String(n)));
const snapH = (d) => { const v = Math.max(0, Math.min(12, Math.round(d * 2) / 2)); return v % 1 ? v.toFixed(1) : String(v); };
const DAY_OPTS = rng(1, 31).map(String);
const THIS_YEAR = new Date().getFullYear();
const YEAR_OPTS = rng(THIS_YEAR - 2, THIS_YEAR + 3).map(String);
const CUR_OPTS = ["₪", "$", "€"];
const TYPE_OPTS = [
  { v: "work", label: "Work" },
  { v: "sick", label: "Sick", cls: "sick" },
  { v: "vacation", label: "Vacation", cls: "vac" },
];
const HTYPE_OPTS = [
  { v: "red", label: "Red · Company", cls: "hred" },
  { v: "yellow", label: "Yellow · Client", cls: "hyel" },
];
const RANGE_OPTS = ["This week", "This month", "Last month", "Last 3 months", "This year", "All time"];
const STATUSES = ["Active", "WIP", "Draft A", "Draft B", "Pending Information", "Pending Review", "On hold", "Done"];
const STATUS_CLR = { "Active": "teal", "WIP": "teal", "Draft A": "yellow", "Draft B": "yellow", "Pending Information": "sick", "Pending Review": "sick", "On hold": "muted", "Done": "vac" };
const NTYPE_OPTS = [{ v: "Note", label: "Note" }, { v: "Snippet", label: "Snippet" }, { v: "Conversation", label: "Conversation" }];
/* same-day span in hours; end at or before start = 0 */
const tspan = (s, e) => Math.max(0, (t2m(e) - t2m(s)) / 60);
/* work-order id: WO-[client initials]-[6 digits] */
const woGen = (client) => {
  const w = String(client || "XX").trim().split(/\s+/).filter(Boolean);
  const ini = (w.length >= 2 ? w[0][0] + w[1][0] : (w[0] || "XX").slice(0, 2)).toUpperCase();
  return `WO-${ini}-${Math.floor(100000 + Math.random() * 900000)}`;
};
const TYPE_FILTER = ["All", "Work", "Sick", "Vacation"];
const descPlaceholder = (type, planner) =>
  type === "sick" ? "What happened? 🤒" : type === "vacation" ? "What's the plan? 😎" : planner ? "Planned work" : "What was the work?";

const startOfWeek = (d) => { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; };
const weekOf = (s) => { const st = startOfWeek(s2d(s)); return rng(0, 6).map((i) => { const t = new Date(st); t.setDate(st.getDate() + i); return d2s(t); }); };
const shiftDate = (s, days) => { const d = s2d(s); d.setDate(d.getDate() + days); return d2s(d); };
const shiftMonthOf = (s, dir) => { const d = s2d(s); d.setDate(1); d.setMonth(d.getMonth() + dir); return d2s(d); };
const monthGrid = (s) => { const d = s2d(s); const first = new Date(d.getFullYear(), d.getMonth(), 1); const st = startOfWeek(first); return rng(0, 41).map((i) => { const t = new Date(st); t.setDate(st.getDate() + i); return d2s(t); }); };
const shiftYM = (ym, dir) => { let [y, m] = ym.split("-").map(Number); m += dir; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } return `${y}-${pad(m)}`; };
const ymLabel = (ym) => { const [y, m] = ym.split("-").map(Number); return `${MONTHS_FULL[m - 1]} ${y}`; };
const kb = (bytes) => (bytes > 1048576 ? (bytes / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(bytes / 1024)) + " KB");
const hoursOf = (e) => (e.type === "work" ? num(e.red) + num(e.yellow) : num(e.day));

/* ================= styled XLSX writer (no dependencies) =================
   Generates real .xlsx files carrying the WorkDesk look: teal title band,
   dark header with red/yellow accent columns, banded rows, thin borders,
   true dates shown as "Sunday, 26/07/2026", auto column widths, frozen
   header and an auto-filter so "everything" exports can be filtered in Excel. */
const XL = (() => {
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const colL = (n) => { let s = "", x = n + 1; while (x > 0) { const m = (x - 1) % 26; s = String.fromCharCode(65 + m) + s; x = (x - 1 - m) / 26; } return s; };
  const dser = (ds) => { const [y, m, d] = String(ds).split("-").map(Number); return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000); };

  /* zip container (store method) */
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = (u) => { let c = -1; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ -1) >>> 0; };
  const u16 = (v) => [v & 255, (v >>> 8) & 255];
  const u32 = (v) => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  const zip = (files) => {
    const enc = new TextEncoder();
    const parts = [], cdir = [];
    let off = 0;
    const n = new Date();
    const tm = ((n.getHours() << 11) | (n.getMinutes() << 5) | (n.getSeconds() >> 1)) & 0xFFFF;
    const dt = (((n.getFullYear() - 1980) << 9) | ((n.getMonth() + 1) << 5) | n.getDate()) & 0xFFFF;
    files.forEach(([name, text]) => {
      const nm = enc.encode(name), body = enc.encode(text), crc = crc32(body);
      parts.push(new Uint8Array([...u32(0x04034B50), ...u16(20), ...u16(0), ...u16(0), ...u16(tm), ...u16(dt), ...u32(crc), ...u32(body.length), ...u32(body.length), ...u16(nm.length), ...u16(0)]), nm, body);
      cdir.push(new Uint8Array([...u32(0x02014B50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(tm), ...u16(dt), ...u32(crc), ...u32(body.length), ...u32(body.length), ...u16(nm.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(off)]), nm);
      off += 30 + nm.length + body.length;
    });
    const cstart = off;
    let csize = 0;
    cdir.forEach((u) => { csize += u.length; });
    parts.push(...cdir, new Uint8Array([...u32(0x06054B50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(csize), ...u32(cstart), ...u16(0)]));
    let total = 0;
    parts.forEach((p) => { total += p.length; });
    const out = new Uint8Array(total);
    let p0 = 0;
    parts.forEach((p) => { out.set(p, p0); p0 += p.length; });
    return out;
  };

  /* brand palette (ARGB) */
  const K = {
    teal: "FF17A3B8", ink: "FF0F2836", white: "FFFFFFFF", muted: "FF5B7683",
    panel: "FFF1F7FA", band: "FFF6FAFC", line: "FFD5E4EA", totalbg: "FFE7F1F4",
    red: "FFE05C4B", yellow: "FFE3AC35", sick: "FF9C8CE8", vac: "FF3FA97E", yelInk: "FF33270A",
    redT: "FFB3402F", yellowT: "FF8F6512", sickT: "FF5D4BB8", vacT: "FF1E7A52", tealT: "FF0E7A8A",
  };
  const NUMF = { num: 164, money: 165, date: 166, pct: 9, int: 1, text: 0 };

  const mkStyles = () => {
    const fonts = [], fills = [{ p: "none" }, { p: "gray125" }], xfs = [];
    const fC = {}, flC = {}, xC = {};
    const font = (o) => { const k = JSON.stringify(o); if (fC[k] == null) { fC[k] = fonts.length; fonts.push(o); } return fC[k]; };
    const fill = (rgb) => { if (!rgb) return 0; if (flC[rgb] == null) { flC[rgb] = fills.length; fills.push({ p: "solid", c: rgb }); } return flC[rgb]; };
    const xf = (o) => { const k = JSON.stringify(o); if (xC[k] == null) { xC[k] = xfs.length; xfs.push(o); } return xC[k]; };
    font({ sz: 10 });
    xf({});
    const xml = () => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="0.0"/><numFmt numFmtId="165" formatCode="#,##0.00"/><numFmt numFmtId="166" formatCode="dddd, dd/mm/yyyy"/></numFmts><fonts count="${fonts.length}">${fonts.map((f) => `<font>${f.b ? "<b/>" : ""}${f.i ? "<i/>" : ""}<sz val="${f.sz || 10}"/><color rgb="${f.c || K.ink}"/><name val="Calibri"/></font>`).join("")}</fonts><fills count="${fills.length}">${fills.map((f) => f.p === "solid" ? `<fill><patternFill patternType="solid"><fgColor rgb="${f.c}"/></patternFill></fill>` : `<fill><patternFill patternType="${f.p}"/></fill>`).join("")}</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="${K.line}"/></left><right style="thin"><color rgb="${K.line}"/></right><top style="thin"><color rgb="${K.line}"/></top><bottom style="thin"><color rgb="${K.line}"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.map((x) => {
      const attrs = `numFmtId="${x.n || 0}" fontId="${x.f || 0}" fillId="${x.fl || 0}" borderId="${x.b || 0}" xfId="0"${x.n ? ' applyNumberFormat="1"' : ""}${x.f ? ' applyFont="1"' : ""}${x.fl ? ' applyFill="1"' : ""}${x.b ? ' applyBorder="1"' : ""}`;
      return x.h || x.v || x.wr
        ? `<xf ${attrs} applyAlignment="1"><alignment${x.h ? ` horizontal="${x.h}"` : ""}${x.v ? ` vertical="${x.v}"` : ""}${x.wr ? ' wrapText="1"' : ""}/></xf>`
        : `<xf ${attrs}/>`;
    }).join("")}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
    return { font, fill, xf, xml };
  };

  /* sheet spec: { name, title, meta, cols:[{h, t:"text|date|num|money|pct|int", c:"red|yellow|sick|vac|teal", wrap}], rows, totals } */
  const workbook = (sheets) => {
    const S = mkStyles();
    const headXf = (c) => S.xf({ f: S.font({ b: 1, sz: 10, c: c === "yellow" ? K.yelInk : K.white }), fl: S.fill(c ? K[c] : K.ink), b: 1, h: "center", v: "center" });
    const cellXf = (t, c, band, wrap, totalRow) => {
      const fo = { sz: 10 };
      if (totalRow) fo.b = 1;
      if (c && K[c + "T"]) fo.c = K[c + "T"];
      const o = { f: S.font(fo), b: 1, v: "center" };
      const fmt = NUMF[t] || 0;
      if (fmt) o.n = fmt;
      o.h = t === "text" || t === "date" ? "left" : "right";
      if (wrap) o.wr = 1;
      if (totalRow) o.fl = S.fill(K.totalbg);
      else if (band) o.fl = S.fill(K.band);
      return S.xf(o);
    };
    const titleXf = S.xf({ f: S.font({ b: 1, sz: 15, c: K.white }), fl: S.fill(K.teal), v: "center", h: "left" });
    const metaXf = S.xf({ f: S.font({ i: 1, sz: 9, c: K.muted }), fl: S.fill(K.panel), v: "center", h: "left" });

    const sheetXmls = sheets.map((sh) => {
      const cols = sh.cols, L = cols.length, lastCol = colL(L - 1);
      const unv = (v) => (v && typeof v === "object" && "v" in v ? v : { v });
      const dispLen = (col, raw) => {
        const o = unv(raw);
        if (o.v == null || o.v === "") return 0;
        const t = o.t || col.t || "text";
        if (t === "date") return 22;
        if (t === "pct") return 7;
        if (typeof o.v === "number") return String(Math.round(o.v * 100) / 100).length + 3;
        return String(o.v).length;
      };
      const widths = cols.map((c, i) => {
        let m = String(c.h).length + 2;
        sh.rows.forEach((r) => { m = Math.max(m, dispLen(c, r[i])); });
        (sh.totals || []).forEach((r) => { m = Math.max(m, dispLen(c, r[i])); });
        return Math.max(8, Math.min(c.wrap ? 40 : 46, m + 3));
      });
      const cellXml = (ri, ci, raw, band, totalRow) => {
        const col = cols[ci], o = unv(raw);
        const t = o.t || col.t || "text";
        const c = o.c !== undefined ? o.c : col.c;
        const s = cellXf(t, c, band, col.wrap, totalRow);
        const ref = colL(ci) + ri;
        if (o.v === "" || o.v == null) return `<c r="${ref}" s="${s}"/>`;
        if (t === "date" && /^\d{4}-\d{2}-\d{2}/.test(o.v)) return `<c r="${ref}" s="${s}"><v>${dser(o.v)}</v></c>`;
        if (typeof o.v === "number" && t !== "text") return `<c r="${ref}" s="${s}"><v>${o.v}</v></c>`;
        return `<c r="${ref}" s="${s}" t="inlineStr"><is><t>${esc(o.v)}</t></is></c>`;
      };
      const rowHt = (row) => {
        let lines = 1;
        cols.forEach((c, i) => {
          if (!c.wrap) return;
          const o = unv(row[i]);
          if (o.v) lines = Math.max(lines, Math.min(3, Math.ceil(String(o.v).length / Math.max(10, widths[i] - 2))));
        });
        return lines > 1 ? lines * 14 + 4 : 0;
      };
      const bandRow = (ri, row, band, totalRow) => {
        const ht = totalRow ? 18 : rowHt(row);
        return `<row r="${ri}"${ht ? ` ht="${ht}" customHeight="1"` : ""}>${row.map((v, i) => cellXml(ri, i, v, band, totalRow)).join("")}</row>`;
      };
      const fillRow = (ri, ht, s, text) => `<row r="${ri}" ht="${ht}" customHeight="1"><c r="A${ri}" s="${s}"${text ? ` t="inlineStr"><is><t>${esc(text)}</t></is></c>` : "/>"}${cols.slice(1).map((c, i) => `<c r="${colL(i + 1)}${ri}" s="${s}"/>`).join("")}</row>`;
      const body = [
        fillRow(1, 27, titleXf, sh.title),
        fillRow(2, 15, metaXf, sh.meta),
        `<row r="3" ht="6" customHeight="1"/>`,
        `<row r="4" ht="21" customHeight="1">${cols.map((c, i) => `<c r="${colL(i)}4" s="${headXf(c.c)}" t="inlineStr"><is><t>${esc(c.h)}</t></is></c>`).join("")}</row>`,
      ];
      sh.rows.forEach((row, i) => body.push(bandRow(5 + i, row, i % 2 === 1, false)));
      let ri = 5 + sh.rows.length;
      if (sh.totals && sh.totals.length) {
        body.push(`<row r="${ri}" ht="6" customHeight="1"/>`); ri++;
        sh.totals.forEach((trow) => { body.push(bandRow(ri, trow, false, true)); ri++; });
      }
      const af = sh.rows.length ? `<autoFilter ref="A4:${lastCol}${4 + sh.rows.length}"/>` : "";
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" showGridLines="0"><pane ySplit="4" topLeftCell="A5" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${body.join("")}</sheetData>${af}<mergeCells count="2"><mergeCell ref="A1:${lastCol}1"/><mergeCell ref="A2:${lastCol}2"/></mergeCells></worksheet>`;
    });

    const wbXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${esc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets></workbook>`;
    const files = [
      ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`],
      ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
      ["xl/workbook.xml", wbXml],
      ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
      ["xl/styles.xml", S.xml()],
    ];
    sheets.forEach((s, i) => files.push([`xl/worksheets/sheet${i + 1}.xml`, sheetXmls[i]]));
    return zip(files);
  };

  const download = (sheets, filename) => {
    const blob = new Blob([workbook(sheets)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 800);
  };
  return { download, workbook };
})();

const SEED = {
  theme: "dark",
  assignees: ["Danny"],
  clients: ["Galil", "Opgal", "Amimon", "Zeiss"],
  projects: ["Internal", "Operator Manual", "Maintenance Guide", "Installation Guide", "Training Deck"],
  etypes: ["Meal", "Trip", "Lodging", "Office", "Other"],
  entries: [],
  plans: [],
  expenses: [],
  budgets: [],
  notes: [],
  pstatus: {},
  adminPin: "",
  hourReqs: [],
  verified: { clients: {}, projects: {} },
};

/* one-time migration: split legacy entries that carry BOTH red and yellow hours
   into a yellow entry (original client) + a red entry (Galil / Internal) */
const splitMixed = (list, galilClient) => {
  const out = [];
  (list || []).forEach((e) => {

/* Spinner: wheel UP = forward, wheel DOWN = back; ▲ = forward; left-click opens a
   scrollable dropdown list. */
function Spinner({ options, value, onChange, w, mono, placeholder, grow, err }) {
  const ref = useRef(null);
  const listRef = useRef(null);
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const live = useRef({});
  live.current = { options, value, onChange, open };

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const h = (e) => {
      if (live.current.open) return; // list is open — let it scroll normally
      e.preventDefault();
      e.stopPropagation();
      const { options, value, onChange } = live.current;
      if (!options.length) return;
      const i = Math.max(0, options.indexOf(value));
      const dir = e.deltaY < 0 ? 1 : -1; // wheel up = forward
      onChange(options[(i + dir + options.length) % options.length]);
    };
    el.addEventListener("wheel", h, { passive: false });
    return () => el.removeEventListener("wheel", h);
  }, []);

  useEffect(() => {
    if (!open) return;
    const onDown = (e) => { if (ref.current && ref.current.contains(e.target)) return; setOpen(false); };
    const onScroll = (e) => { if (listRef.current && listRef.current.contains(e.target)) return; setOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", onDown);
    document.addEventListener("scroll", onScroll, true);
    document.addEventListener("keydown", onKey);
    return () => {
      document.removeEventListener("mousedown", onDown);
      document.removeEventListener("scroll", onScroll, true);
      document.removeEventListener("keydown", onKey);
    };
  }, [open]);

  useEffect(() => {
    if (open && listRef.current) {
      const el = listRef.current.querySelector(".ddi.on");
      if (el) el.scrollIntoView({ block: "center" });
    }
  }, [open]);

  const step = (d) => {
    const { options, value, onChange } = live.current;
    if (!options.length) return;
    const i = Math.max(0, options.indexOf(value));
    onChange(options[(i + d + options.length) % options.length]);
  };

  const toggleOpen = () => {
    if (!options.length) return;
    if (!open && ref.current) {
      const r = ref.current.getBoundingClientRect();
      const up = window.innerHeight - r.bottom < 210 && r.top > 210;
      setPos({ left: r.left, width: Math.max(r.width, 110), top: up ? null : r.bottom + 4, bottom: up ? window.innerHeight - r.top + 4 : null });
    }
    setOpen((o) => !o);
  };

  return (
    <div ref={ref} className={"spin" + (mono ? " mono" : "") + (grow ? " grow" : "") + (err ? " err" : "")} style={w ? { width: w, flex: `0 1 ${w}px` } : null} title="Scroll or click to choose">
      <button type="button" className="valbtn" onClick={toggleOpen}
        onKeyDown={(e) => {
          if (e.key === "ArrowUp") { e.preventDefault(); step(1); }
          if (e.key === "ArrowDown") { e.preventDefault(); step(-1); }
        }}>
        <span className="val">{value || placeholder || "—"}</span>
      </button>
      <span className="chevs">
        <button type="button" className="chev" aria-label="Forward" onClick={() => step(1)}>▲</button>
        <button type="button" className="chev" aria-label="Back" onClick={() => step(-1)}>▼</button>
      </span>
      {open && pos && (
        <div ref={listRef} className="ddl" role="listbox"
          style={{ left: pos.left, width: pos.width, top: pos.top ?? "auto", bottom: pos.bottom ?? "auto" }}>
          {options.map((o) => (
            <button key={o} type="button" role="option" aria-selected={o === value}
              className={"ddi" + (o === value ? " on" : "") + (mono ? " mono" : "")}
              onClick={() => { onChange(o); setOpen(false); }}>
              {o}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* generic anchored popover (outside click / Esc / scroll closes it) */
function usePop(width = 260) {
  const ref = useRef(null);
  const popRef = useRef(null);
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  useEffect(() => {
    if (!open) return;
    const down = (e) => { if ((ref.current && ref.current.contains(e.target)) || (popRef.current && popRef.current.contains(e.target))) return; setOpen(false); };
    const sc = (e) => { if (popRef.current && popRef.current.contains(e.target)) return; setOpen(false); };
    const key = (e) => { if (e.key === "Escape") setOpen(false); };
    document.addEventListener("mousedown", down);
    document.addEventListener("scroll", sc, true);
    document.addEventListener("keydown", key);
    return () => { document.removeEventListener("mousedown", down); document.removeEventListener("scroll", sc, true); document.removeEventListener("keydown", key); };
  }, [open]);
  const toggle = () => {
    if (!open && ref.current) {
      const r = ref.current.getBoundingClientRect();
      const up = window.innerHeight - r.bottom < 330 && r.top > 330;
      setPos({ left: Math.max(8, Math.min(r.left, window.innerWidth - width - 8)), top: up ? null : r.bottom + 6, bottom: up ? window.innerHeight - r.top + 6 : null });
    }
    setOpen((o) => !o);
  };
  return { ref, popRef, open, setOpen, pos, toggle };
}

          )

    </div>
  );
}

    XL.download([{
      name: "Expenses", title: "GALIL WorkDesk — Expenses",
      meta: all ? `All data · ${list.length} expenses · ${stamp()}` : `Period ${ymLabel(xMonth)} · Assignee ${filterX} · Type ${xType} · ${stamp()}`,
      cols: EXP_COLS,
      rows: list.map((x) => [x.date, x.time, x.assignee, x.etype, cap(x.vkind), x.vkind === "money" ? x.currency : "", x.vkind === "money" ? num(x.amount) : "", x.vkind === "time" ? num(x.hours) : "", x.vkind === "other" ? x.other : "", x.description, x.notes, (x.files || []).map((f) => f.name).join(", ")]),
      totals: Object.entries(mt).map(([c, v]) => ["TOTAL", "", "", "", "", c, r1(v), "", "", "", "", ""]),
    }], all ? "galil-expenses-all.xlsx" : `galil-expenses-${xMonth}.xlsx`);
  };

  const exportDash = (scope) => {
    const all = scope === "all";
    const E = all ? data.entries : dEntries;
    const X = all ? data.expenses : dExp;
    const P = all ? data.plans : dPlans;
    if (!E.length && !X.length && !P.length) return flash(all ? "No data yet." : "Nothing to export with these filters.");
    const meta = all ? `All data · ${stamp()}` : `Range ${range} · Client ${dClient} · Project ${dProject} · Employees ${selEmp.join(", ") || "All"} · ${stamp()}`;
    const T = agg(E), TA = T.red + T.yellow;
    const moneyTxt2 = Object.entries(X.filter((x) => x.vkind === "money").reduce((m, x) => { m[x.currency] = (m[x.currency] || 0) + num(x.amount); return m; }, {}))
      .map(([c, v]) => `${c} ${fmt(v)}`).join(" · ") || "—";
    const eRows = [...new Set(E.map((e) => e.assignee))]
      .map((a) => ({ name: a, ...agg(E.filter((e) => e.assignee === a)) }))
      .map((r) => ({ ...r, total: r.red + r.yellow })).sort((a, b) => b.total - a.total);
    const cRows = [...new Set(E.filter((e) => e.type === "work" && e.client).map((e) => e.client))]
      .map((c) => ({ name: c, yellow: E.filter((e) => e.client === c).reduce((s, e) => s + num(e.yellow), 0) }))
      .filter((r) => r.yellow > 0).sort((a, b) => b.yellow - a.yellow);
    const months = {};
    E.forEach((e) => { const k = e.date.slice(0, 7); if (!months[k]) months[k] = { red: 0, yellow: 0 }; months[k].red += num(e.red); months[k].yellow += num(e.yellow); });
    const tRows = all
      ? Object.keys(months).sort().map((k) => [`${MONTHS[Number(k.slice(5)) - 1]} ${k.slice(0, 4)}`, r1(months[k].red), r1(months[k].yellow)])
      : trend.map((t2) => [t2.label, t2.Red, t2.Yellow]);
    const pRows = [...new Set([...P.map((p) => p.assignee), ...E.map((e) => e.assignee)])].map((a) => {
      const Pp = agg(P.filter((p) => p.assignee === a)), L = agg(E.filter((e) => e.assignee === a));
      const planned = Pp.red + Pp.yellow, logged = L.red + L.yellow;
      return [a, r1(Pp.red), r1(Pp.yellow), r1(planned), r1(L.red), r1(L.yellow), r1(logged), r1(logged - planned), planned > 0 ? { v: Math.round((logged / planned) * 100) / 100, t: "pct" } : "—"];
    }).sort((a, b) => b[3] - a[3]);
    const sheets = [{
      name: "Summary", title: "GALIL WorkDesk — Dashboard", meta,
      cols: [{ h: "Metric" }, { h: "Value" }],
      rows: [
        ["Total logged hours", { v: r1(TA), t: "num" }],
        ["Red · company hours", { v: r1(T.red), t: "num", c: "red" }],
        ["Yellow · client hours", { v: r1(T.yellow), t: "num", c: "yellow" }],
        ["Red share of logged", TA ? Math.round((T.red / TA) * 100) + "%" : "—"],
        ["Yellow share of logged", TA ? Math.round((T.yellow / TA) * 100) + "%" : "—"],
        ["Sick days taken", { v: T.sickD, t: "int", c: "sick" }],
        ["Sick hours reported", { v: r1(T.sickH), t: "num", c: "sick" }],
        ["Vacation days taken", { v: T.vacD, t: "int", c: "vac" }],
        ["Vacation hours reported", { v: r1(T.vacH), t: "num", c: "vac" }],
        ["Expenses reported", { v: X.length, t: "int" }],
        ["Expenses total", moneyTxt2],
      ],
    }];
    if (eRows.length) sheets.push({
      name: "By employee", title: "Hours by employee", meta,
      cols: [{ h: "Employee" }, { h: "Red h", t: "num", c: "red" }, { h: "Yellow h", t: "num", c: "yellow" }, { h: "Total h", t: "num" }, { h: "Sick days", t: "int", c: "sick" }, { h: "Sick h", t: "num", c: "sick" }, { h: "Vacation days", t: "int", c: "vac" }, { h: "Vacation h", t: "num", c: "vac" }],
      rows: eRows.map((r) => [r.name, r1(r.red), r1(r.yellow), r1(r.total), r.sickD || "", r1(r.sickH) || "", r.vacD || "", r1(r.vacH) || ""]),
    });
    if (cRows.length) sheets.push({
      name: "By client", title: "Client hours by client", meta,
      cols: [{ h: "Client" }, { h: "Yellow h", t: "num", c: "yellow" }],
      rows: cRows.map((r) => [r.name, r1(r.yellow)]),
    });
    if (tRows.length) sheets.push({
      name: "Trend", title: all ? "Red / Yellow trend per month" : `Red / Yellow trend per ${bucket}`, meta,
      cols: [{ h: "Period" }, { h: "Red h", t: "num", c: "red" }, { h: "Yellow h", t: "num", c: "yellow" }],
      rows: tRows,
    });
    if (P.length) sheets.push({
      name: "Plan vs actual", title: "Plan vs actual", meta,
      cols: [{ h: "Employee" }, { h: "Planned Red h", t: "num", c: "red" }, { h: "Planned Yellow h", t: "num", c: "yellow" }, { h: "Planned h", t: "num" }, { h: "Logged Red h", t: "num", c: "red" }, { h: "Logged Yellow h", t: "num", c: "yellow" }, { h: "Logged h", t: "num" }, { h: "Diff h", t: "num" }, { h: "Of plan", t: "pct" }],
      rows: pRows,
    });
    XL.download(sheets, all ? "galil-dashboard-all.xlsx" : `galil-dashboard-${range.replace(/\s+/g, "-").toLowerCase()}.xlsx`);
  };

  const exportBudgets = (scope) => {
    const all = scope === "all";
    const list = all ? budAllRows : budRows;
    if (!list.length) return flash(all ? "No budgets set yet." : "No budgets match this filter.");
    const meta = all ? `All budgets · ${stamp()}` : `Client ${bClient} · Project ${bProject} · ${stamp()}`;
    const basisTxt = (b) => (b.kind === "money" ? "Money" : b.kind === "hours" ? "Hours" : cap(unitOf(b)));
    const mTot = list.reduce((m, b) => { if (b.kind !== "hours") { const k = b.currency; if (!m[k]) m[k] = { budget: 0, used: 0, left: 0 }; m[k].budget += b.total; m[k].used += b.used; m[k].left += b.left; } return m; }, {});
    const hTot = list.filter((b) => b.kind === "hours").reduce((a, b) => { a.budget += b.total; a.used += b.used; a.left += b.left; return a; }, { budget: 0, used: 0, left: 0 });
    const totals = Object.entries(mTot).map(([c, v]) => ["TOTAL", "", "", "Money-valued", c, r1(v.budget), "", "", "", "", r1(v.used), r1(v.left), "", ""]);
    if (list.some((b) => b.kind === "hours")) totals.push(["TOTAL", "", "", "Hours", "", { v: r1(hTot.budget), t: "num" }, "", "", "", "", { v: r1(hTot.used), t: "num" }, { v: r1(hTot.left), t: "num" }, "", ""]);
    XL.download([{
      name: "Budgets", title: "GALIL WorkDesk — Budgets", meta,
      cols: [{ h: "Client" }, { h: "Project" }, { h: "Work Order" }, { h: "Basis" }, { h: "Currency" }, { h: "Budget", t: "money", c: "teal" }, { h: "Rate / unit price", t: "money" }, { h: "Qty", t: "num" }, { h: "Delivered", t: "num" }, { h: "Logged h", t: "num" }, { h: "Used", t: "money", c: "red" }, { h: "Remaining", t: "money", c: "vac" }, { h: "Used %", t: "pct" }, { h: "Notes", wrap: true }],
      rows: list.map((b) => [
        b.client, b.project, b.wo || "", basisTxt(b), b.kind === "hours" ? "" : b.currency,
        b.kind === "hours" ? { v: b.total, t: "num" } : b.total,
        b.kind === "money" ? num(b.rate) : b.deliv ? num(b.price) : "",
        b.deliv ? num(b.qty) : "", b.deliv ? num(b.done) : "",
        b.usedH,
        b.kind === "hours" ? { v: b.used, t: "num" } : b.used,
        b.kind === "hours" ? { v: b.left, t: "num" } : b.left,
        { v: b.pct / 100, t: "pct" }, b.notes || "",
      ]),
      totals,
    }], all ? "galil-budgets-all.xlsx" : "galil-budgets-filtered.xlsx");
  };


  const theme = data.theme || "dark";
  const C = theme === "dark"
    ? { red: "#E05C4B", yellow: "#E3AC35", muted: "#87A5B2", grid: "rgba(122,208,220,.16)", panel: "#0E2634", text: "#EAF4F7" }
    : { red: "#B3402F", yellow: "#B07E17", muted: "#5B7683", grid: "#D5E4EA", panel: "#FFFFFF", text: "#0F2836" };
  const toggleTheme = () => setData((d) => ({ ...d, theme: d.theme === "dark" ? "light" : "dark" }));

  const setT = setTimes(setTf);
  const setP = setTimes(setPf);
  const setHT = setHtype(setTf);
  const setHP = setHtype(setPf);

  /* ================= render ================= */
  return (
    <div className="app" data-theme={theme}>
      <style>{CSS}</style>

      {/* ---------- header ---------- */}
      <header className="hdr">
        <div className="brand">
          <svg width="34" height="30" viewBox="0 0 40 34" aria-hidden="true">
            <path d="M3 24 C 9 12, 15 12, 20 24 S 32 36, 37 24" fill="none" stroke="var(--teal)" strokeWidth="4" strokeLinecap="round" />
            <path d="M6 12 C 11 4, 16 4, 20 12 S 30 20, 34 12" fill="none" stroke="var(--teal2)" strokeWidth="2.6" strokeLinecap="round" opacity="0.75" />
          </svg>
          <div>
            <div className="bname">GALIL</div>
            <div className="bsub">WorkDesk</div>
          </div>
        </div>

        <nav className="tabs" aria-label="Sections">
          <button className={"tab" + (tab === "time" ? " on" : "")} onClick={() => setTab("time")}>Time Log</button>
          <button className={"tab" + (tab === "plan" ? " on" : "")} onClick={() => setTab("plan")}>Week Planner</button>
          <button className={"tab" + (tab === "exp" ? " on" : "")} onClick={() => setTab("exp")}>Expenses</button>
          <button className={"tab" + (tab === "lib" ? " on" : "")} onClick={() => setTab("lib")}>Library</button>
          <button className={"tab" + (tab === "bud" ? " on" : "")} onClick={() => setTab("bud")}>Budgets</button>
          <button className={"tab" + (tab === "dash" ? " on" : "")} onClick={() => setTab("dash")}>Dashboard</button>
        </nav>

        <div className="hspace" />

        <div className="ribbon" title="This week — whole team">
          <div className="rlab"><span>THIS WEEK</span><span>{fmt(wAll)}h</span></div>
          <div className="rbar">
            {wAll > 0 ? (
              <>
                {wt.red > 0 && <span style={{ width: (wt.red / wAll) * 100 + "%", background: "var(--red)" }} />}
                {wt.yellow > 0 && <span style={{ width: (wt.yellow / wAll) * 100 + "%", background: "var(--yellow)" }} />}
                {wt.sick > 0 && <span style={{ width: (wt.sick / wAll) * 100 + "%", background: "var(--sick)" }} />}
                {wt.vac > 0 && <span style={{ width: (wt.vac / wAll) * 100 + "%", background: "var(--vac)" }} />}
              </>
            ) : <span style={{ width: "100%", background: "var(--line)" }} />}
          </div>
        </div>

        <button className="tbtn" onClick={() => setSettingsOpen(true)} title="Manage lists · backup & restore" aria-label="Settings">⚙</button>
        <button className="tbtn" onClick={toggleTheme} title="Switch theme" aria-label="Switch theme">
          {theme === "dark" ? "☀" : "☾"}
        </button>
      </header>

      {/* ---------- TIME LOG ---------- */}
      {tab === "time" && (
        <main className="content">
          <section className="panel">
            <div className="phead">
              <span className="ptitle">{tf.id ? "Edit entry" : "New time entry"}</span>
              <div className="hspace" />
              {tf.id && <button className="btn ghost sm" onClick={() => setTf(blankTF(data))}>Cancel</button>}
            </div>
            <div className="pbody">
              <div className="frow"><label className="lbl">Assignee</label>
                <AddSpin err={eCls("assignee")} options={data.assignees} value={tf.assignee} onChange={(v) => uT({ assignee: v })} onAdd={(v) => addTo("assignees", v)} addLabel="Full name" />
              </div>
              <div className="frow"><label className="lbl">Date</label>
                <div className="hrow"><DateSpin value={tf.date} onChange={(v) => uT({ date: v })} /><button className="ib txt" onClick={() => uT({ date: todayStr() })}>Today</button></div>
              </div>
              <div className="frow"><label className="lbl">Entry type</label>
                <Seg options={TYPE_OPTS} value={tf.type} onChange={(v) => uT({ type: v })} />
              </div>

              {tf.type === "work" ? (
                <>
                  <div className="frow two">
                    <div><label className="lbl">Start</label><TimeSpin err={eCls("time")} value={tf.start} onChange={(v) => { setT({ start: v }); clearErrs(); }} /></div>
                    <div><label className="lbl">End</label><TimeSpin err={eCls("time")} value={tf.end} onChange={(v) => { setT({ end: v }); clearErrs(); }} /></div>
                  </div>
                  <div className="frow"><label className="lbl">Hours type</label>
                    <Seg options={HTYPE_OPTS} value={tf.htype} onChange={setHT} />
                  </div>
                  <div className="frow"><label className="lbl">Client</label>
                    <AddSpin err={eCls("client")} options={data.clients} value={tf.client} onChange={(v) => uT({ client: v })} onAdd={(v) => addTo("clients", v)} addLabel="New client name" />
                  </div>
                  <div className="frow"><label className="lbl">Project</label>
                    <AddSpin err={eCls("project")} options={data.projects} value={tf.project} onChange={(v) => uT({ project: v })} onAdd={(v) => addTo("projects", v)} addLabel="New project name" />
                  </div>
                  <div className="frow"><label className="lbl">Project status</label>
                    <Spinner grow options={STATUSES} value={pstatusOf(tf.project)} onChange={(v) => setPStatus(tf.project, v)} />
                  </div>
                  {(() => {
                    const al = allowanceFor(tf.assignee, tf.client, tf.project);
                    if (!al) return null;
                    if (!al.row) return <div className="sub cerr" style={{ marginTop: -4, marginBottom: 8 }}>{tf.assignee} isn't assigned to this project — a manager assigns people in Budgets.</div>;
                    const cap = num(al.row.hours);
                    return (
                      <div className="sub" style={{ marginTop: -4, marginBottom: 8 }}>
                        Allowance: {fmt(al.used)}h used{cap > 0 ? ` of ${fmt(cap)}h · ${fmt(r1(Math.max(0, cap - al.used)))}h left` : " · no personal cap"}
                      </div>
                    );
                  })()}
                  <div className="frow"><label className={"lbl " + (tf.htype === "red" ? "cred" : "cyel")}>{tf.htype === "red" ? "Red hours" : "Yellow hours"}</label>
                    <div className={"hoursout " + tf.htype + (eCls("time") ? " err" : "")} title="Computed from Start and End — adjust the times to change it">
                      <span className="mono hv">{fmt(r1(tspan(tf.start, tf.end)))}h</span>
                      <span className="sub">{tf.htype === "red" ? "Red · Company" : "Yellow · Client"} · from {tf.start}–{tf.end}</span>
                      {tspan(tf.start, tf.end) > 9 && tspan(tf.start, tf.end) <= 12 && <span className="stchip yellow">needs approval</span>}
                      {tspan(tf.start, tf.end) > 12 && <span className="stchip red">over the 12h cap</span>}
                    </div>
                  </div>
                </>
              ) : (
                <div className="frow"><label className="lbl">{tf.type === "sick" ? "Sick day · hours" : "Vacation · hours"}</label>
                  <Spinner mono grow options={HRS_OPTS} value={tf.day} onChange={(v) => uT({ day: v })} />
                </div>
              )}

              <div className="frow"><label className="lbl">Description</label>
                <input className="input" placeholder={descPlaceholder(tf.type)} value={tf.description} onChange={(e) => uT({ description: e.target.value })} />
              </div>
              <div className="frow"><label className="lbl">Notes</label>
                <textarea className="input" placeholder="Optional" value={tf.notes} onChange={(e) => uT({ notes: e.target.value })} />
              </div>
              {note && <div className="notice">{note}</div>}
              <button className="btn" onClick={submitTime}>{tf.id ? "Save changes" : "Add entry"}</button>
              {tf.id && <button className="btn danger wide" onClick={() => { const id = tf.id; setTf(blankTF(data)); delEntry(id); }}>Delete entry</button>}
              {tf.type === "work" && (
                <button className="btn ghost wide" onClick={openReq} title="Ask a manager for more hours on this project">
                  ⏱ Request additional hours
                </button>
              )}
              {tf.type === "work" && !tf.id && (
                <button className="btn ghost wide" onClick={splitTime} title="Saves this entry and starts the companion entry">
                  {tf.htype === "yellow" ? "Add & split → Red · Galil / Internal" : "Add & split → Yellow · client work"}
                </button>
              )}
            </div>
          </section>

          <section className="panel">
            <div className="phead">
              <button className="mini" onClick={() => setTMonth((m) => shiftYM(m, -1))} aria-label="Previous month">‹</button>
              <MonthPop label={ymLabel(tMonth)} ym={tMonth} onPick={setTMonth} />
              <button className="mini" onClick={() => setTMonth((m) => shiftYM(m, 1))} aria-label="Next month">›</button>
              <button className="btn ghost sm" onClick={() => setTMonth(todayStr().slice(0, 7))}>This month</button>
              <div className="hspace" />
              <ExportMenu onFiltered={() => exportTime("view")} onAll={() => exportTime("all")} filteredLabel={`This view · ${ymLabel(tMonth)}`} allLabel="All time entries · filter in Excel" />
            </div>
            <div className="filterrow">
              <span className="flab">FILTER</span>
              <EmpSelect options={data.assignees} value={tEmp} onChange={setTEmp} />
              <span className="vsep" />
              <Spinner w={128} options={["All", ...data.clients]} value={tClient} onChange={setTClient} />
              <Spinner w={128} options={["All", ...data.projects]} value={tProject} onChange={setTProject} />
              <Spinner w={104} options={TYPE_FILTER} value={tType} onChange={setTType} />
            </div>
            <div className="totrow">
              <span className="chip red">Red {fmt(tot.red)}h</span>
              <span className="chip yellow">Yellow {fmt(tot.yellow)}h</span>
              <span className="chip sick">Sick {fmt(tot.sick)}h</span>
              <span className="chip vac">Vac {fmt(tot.vac)}h</span>
              <div className="hspace" />
              <span className="sum mono">{fmt(tot.all)}h total</span>
            </div>
            <div className="pbody">
              {fEntries.length === 0 && <div className="empty">No entries match these filters for {ymLabel(tMonth)}.</div>}
              {fEntries.map((e) => (
                <div className={"item" + (tf.id === e.id ? " editing" : "")} key={e.id} onClick={() => editEntry(e)}>
                  <div className="idate">
                    <span className="mono d">{fmtNice(e.date)}</span>
                    {e.type === "work" && <span className="sub mono">{e.start}–{e.end}</span>}
                  </div>
                  <div className="imain">
                    <div className="ttl">{e.type === "work" ? `${e.client} — ${e.project}` : e.type === "sick" ? "Sick day" : "Vacation day"}</div>
                    <div className="sub">{e.assignee}{e.description ? " · " + e.description : ""}{e.notes ? " · " + e.notes : ""}</div>
                    {(e.type === "work" && (e.project || e.approval)) && (
                      <div className="irowchips">
                        {e.project && (
                          <span onClick={(ev) => ev.stopPropagation()}>
                            <StatusPick value={pstatusOf(e.project)} onPick={(s) => setPStatus(e.project, s)} />
                          </span>
                        )}
                        {e.project && (() => { const b = budFor(e.client, e.project); return b ? <span className={"stchip " + (b.over ? "red" : b.pct >= 85 ? "yellow" : "teal")} title={`Budget${b.wo ? " " + b.wo : ""} — ${b.pct}% ${b.deliv ? "delivered" : "used"}`}>◔ {b.pct}%</span> : null; })()}
                        {e.approval === "pending" && <span className="stchip yellow" title="Over 9h — needs a manager's approval">⏳ pending approval</span>}
                        {e.approval === "approved" && <span className="stchip vac" title="Extra hours approved">✓ approved</span>}
                      </div>
                    )}
                  </div>
                  <HourChips e={e} />
                  <div className="acts">
                    {isAdmin && e.approval === "pending" && <button className="mini ok" title="Approve the extra hours" onClick={(ev) => { ev.stopPropagation(); approveEntry(e.id); }}>✓</button>}
                    <button className="mini" title="Duplicate into the form" onClick={(ev) => { ev.stopPropagation(); dupEntry(e); }}>⧉</button>
                    <button className="mini" title="Edit" onClick={(ev) => { ev.stopPropagation(); editEntry(e); }}>✎</button>
                    <button className="mini" title="Delete" onClick={(ev) => { ev.stopPropagation(); delEntry(e.id); }}>✕</button>
                  </div>
                </div>
              ))}
            </div>
          </section>
        </main>
      )}

      {/* ---------- WEEK PLANNER ---------- */}
      {tab === "plan" && (
        <main className="content">
          <section className="panel" ref={planFormRef}>
            <div className="phead">
              <span className="ptitle">{pf.id ? "Edit plan" : "Plan " + fmtNice(pf.date)}</span>
              <div className="hspace" />
              {pf.id && <button className="btn ghost sm" onClick={() => setPf(blankPF(data, selDate))}>Cancel</button>}
            </div>
            <div className="pbody">
              <div className="frow"><label className="lbl">Assignee</label>
                <AddSpin options={data.assignees} value={pf.assignee} onChange={(v) => uP({ assignee: v })} onAdd={(v) => addTo("assignees", v)} addLabel="Full name" />
              </div>
              <div className="frow"><label className="lbl">Date</label><DateSpin value={pf.date} onChange={(v) => { uP({ date: v }); setSelDate(v); }} /></div>
              <div className="frow"><label className="lbl">Entry type</label>
                <Seg options={TYPE_OPTS} value={pf.type} onChange={(v) => uP({ type: v })} />
              </div>
              {pf.type === "work" ? (
                <>
                  <div className="frow two">
                    <div><label className="lbl">Start</label><TimeSpin value={pf.start} onChange={(v) => setP({ start: v })} /></div>
                    <div><label className="lbl">End</label><TimeSpin value={pf.end} onChange={(v) => setP({ end: v })} /></div>
                  </div>
                  <div className="frow"><label className="lbl">Hours type</label>
                    <Seg options={HTYPE_OPTS} value={pf.htype} onChange={setHP} />
                  </div>
                  <div className="frow"><label className="lbl">Client</label>
